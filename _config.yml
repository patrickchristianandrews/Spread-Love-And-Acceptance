# GitHub Pages builds this site with Jekyll. Jekyll skips folders that start with a dot,
# so this line publishes /.well-known/, where the Google Play app's ownership file
# (assetlinks.json) must live. Nothing else about the site changes.
include: [".well-known"]

# polish24c: working files that were being published at their own addresses (internal notes, paywall and
# dashboard setup docs, test screenshots and exports, a Python wheel, database schema, old manuscript drafts).
# Nothing on the site links to any of them (checked with tools/checks/site-health.js). Jekyll leaves them out of
# the published site; they stay in the repository. Do not list anything a page or script loads.
# polish29: internal tooling and owner notes are not part of the site. tools/ holds the build and test scripts
# (some of them carry owner notes and the book-making steps), _manuscripts/ the book drafts. Jekyll leaves them out of
# the published site; they stay in the repository. The few real PAGES under tools/ stay published: the six .html files
# directly inside tools/ (soften-a-tense-moment, soften-a-tense-moment-full, mood-arbitrage-free, mood-arbitrage-full,
# frequency-calibration, frequency-sync-visualizer), so only the sub-folders of tools/ are listed, one by one.
# tools/checks/site-health.js fails if _manuscripts/ or a tools/ sub-folder stops being left out, or if a published page is.
# tools/book/ is hidden except examples.json and examples/, which the tool pages fetch (assets/js/tool-guide.js, tools-page.js).
# tools/kids/fonts/ stays published too: the print sources in book/kids/src/ (published, and found by the chat) load those fonts.
# Jekyll matches an entry as a path prefix, so a folder is written with a trailing slash (plain "telemetry" also hid telemetry.html).
exclude:
  - README.md
  - paywall-integration.md
  - dashboard-setup.md
  - manage-members.py
  - qrcode-8.2-py3-none-any.whl
  - wp-04.md
  - wp-11.md
  - suite-index.md
