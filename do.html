<div id="dw" class="dw-root no-bubble" data-dw>
  <h1 class="dw-h1" id="dw-h">What do you want to do today?</h1>
  <p class="dw-lead">Pick one. Each way in has a short list of free things to try, with the best one first.</p>
</div>
<!-- intents-fallback:start -->
<noscript>

<section class="dw-nj" id="nj-feeling"><h2>Understand a feeling</h2><p>You know something is off and can’t say what. These get you from a knot to a few plain words, on your own, in a few minutes.</p><ul><li><a href="/what-am-i-feeling.html">Paint Your Feelings</a> <span>5 min</span></li><li><a href="/brain-map.html">Brain Map</a> <span>5 min</span></li><li><a href="/quick-checks.html#today">My weather today</a> <span>1 min</span></li><li><a href="/workpapers/wp-02-how-much-are-you-carrying.html">How much are you carrying?</a> <span>2 min</span></li><li><a href="/support-languages.html">Support languages</a> <span>3 min</span></li><li><a href="/old-hurts-new-reactions.html">Old hurts and new reactions</a> <span>13 min read</span></li><li><a href="/nervous-system.html">Your nervous system, in plain words</a> <span>14 min read</span></li></ul></section>
<section class="dw-nj" id="nj-say-it"><h2>Say something hard, well</h2><p>A hard talk usually goes wrong in the first sentence. These help you pick yours before you send it or say it.</p><ul><li><a href="/signal-translator.html">Chat analyzer</a> <span>2 min</span></li><li><a href="/write-it-through.html">Write it through</a> <span>10 min</span></li><li><a href="/workpapers/wp-09-say-it-so-it-lands.html">Say it so it lands</a> <span>5 min</span></li><li><a href="/carrier-wave-decoder.html">Rewind the talk</a> <span>15 min</span></li><li><a href="/refusals.html">Say no kindly</a> <span>3 min read</span></li><li><a href="/apology-languages.html">Apology languages</a> <span>4 min read</span></li><li><a href="/check-ins.html#card">Kitchen-table check-in</a> <span>15 min</span></li></ul></section>
<section class="dw-nj" id="nj-calm"><h2>Calm down right now</h2><p>Nothing here asks you to talk. Pick one, give it five minutes, and decide what to do after.</p><ul><li><a href="/upset-right-now.html">Upset right now?</a> <span>5 min</span></li><li><a href="/night-garden.html">The Night Garden</a> <span>5 min</span></li><li><a href="/tools/soften-a-tense-moment.html">Soften a tense moment</a> <span>6 min</span></li><li><a href="/soundscapes.html#brain-breakers">Brain Breakers</a> <span>A few minutes</span></li><li><a href="/sleeping-pals-cam.html">Sleeping Pals Cam</a> <span>As long as you like</span></li><li><a href="/help-it-settle.html">Helping it settle</a> <span>10 min read</span></li><li><a href="/wp-11.html">The calm-down plan</a> <span>10 min</span></li></ul></section>
<section class="dw-nj" id="nj-load"><h2>Share the load at home</h2><p>Most of the work at home is the kind nobody sees. Count it first. Then split it, and check that the split is working.</p><ul><li><a href="/lemonade-stand.html#quick">Who does what?</a> <span>2 min</span></li><li><a href="/workpapers/calculators/is-the-setup-working-quick.html">Fair split check</a> <span>5 min</span></li><li><a href="/workpapers/wp-03-one-owner-per-job.html">One owner per job</a> <span>10 min</span></li><li><a href="/workpapers/wp-01.html">Who did what this week</a> <span>5 min</span></li><li><a href="/chore-chart-for-couples.html">A printable chore chart</a> <span>10 min</span></li><li><a href="/invisible-labor-mental-load.html">Invisible labor and the mental load</a> <span>7 min read</span></li><li><a href="/share-the-load.html">Share the load, step by step</a> <span>3 min read</span></li></ul></section>
<section class="dw-nj" id="nj-learn"><h2>Learn something new</h2><p>Pick how much time you have. Each of these ends with something you can use the same day.</p><ul><li><a href="/brain-map.html">Brain Map</a> <span>5 min</span></li><li><a href="/start-in-10-minutes.html">Start in 10 minutes</a> <span>10 min</span></li><li><a href="/#small-days">Seven small days</a> <span>About a minute a day</span></li><li><a href="/do/index.html">Learn by doing</a> <span>5 min</span></li><li><a href="/prog-01.html">The six-week program</a> <span>30 min a week</span></li><li><a href="/ask.html">Ask Professor Puddles</a> <span>2 min</span></li><li><a href="/learn/index.html">Philosophy for everyday life</a> <span>5 min read</span></li><li><a href="/frequency-framework.html">The Frequency Framework</a> <span>3 min read</span></li></ul></section>
<section class="dw-nj" id="nj-read"><h2>Read something</h2><p>All of it is free, with no sign-up. Start with the book, or go straight to the guide for the person you’re dealing with.</p><ul><li><a href="/book/index.html">The book</a> <span>About 10 min a chapter</span></li><li><a href="/by-relationship.html">Guides by relationship</a> <span>Find yours</span></li><li><a href="/library.html">Psychology in plain words</a> <span>13 topics</span></li><li><a href="/the-logic-behind-it.html">The Logic Behind It</a> <span>2 min each</span></li><li><a href="/reading.html">Articles worth reading</a> <span>Varies</span></li><li><a href="/book/download.html">Books and downloads</a> <span>PDFs</span></li><li><a href="/research.html">The research behind the site</a> <span>Long</span></li><li><a href="/explore.html">Everything on this site</a> <span>Browse</span></li></ul></section>
<section class="dw-nj" id="nj-create"><h2>Get creative</h2><p>Not everything has to be talked out. These turn it into a picture, a song, or a page to color.</p><ul><li><a href="/what-am-i-feeling.html">Paint Your Feelings</a> <span>5 min</span></li><li><a href="/ask.html#try-asking">Get a picture made with Professor Puddles</a> <span>2 min</span></li><li><a href="/frequency-buddies-music-video-maker.html">Make your own music video</a> <span>10 min</span></li><li><a href="/calm-visualizer.html">Drift</a> <span>A few quiet minutes</span></li><li><a href="/soundscapes.html#brain-breakers">Brain Breakers</a> <span>A few minutes</span></li><li><a href="/book/download.html#kids">Coloring books to print</a> <span>An afternoon</span></li><li><a href="/sleeping-pals-cam.html">Sleeping Pals Cam</a> <span>As long as you like</span></li><li><a href="/wiring-card.html">A card on how to talk to you</a> <span>5 min</span></li></ul></section>
<section class="dw-nj" id="nj-play"><h2>Play or watch something</h2><p>No timers and no way to lose. Tidbit and Sugarfoot run most of it.</p><ul><li><a href="/frequency-journey.html">Tidbit and Sugarfoot’s Arcade</a> <span>A couple of minutes a game</span></li><li><a href="/frequency-journey.html#derby">Home Run Derby</a> <span>2 min</span></li><li><a href="/coin-pusher.html">Kindness Coin Pusher</a> <span>3 min</span></li><li><a href="/word-bloom.html">Word Bloom</a> <span>2 min a level</span></li><li><a href="/quiet-crossword.html">Quiet Crossword</a> <span>5 min</span></li><li><a href="/frequency-buddies.html?ep=s1e4#episode-player">Cartoon: Who Broke the Kite?</a> <span>19 min</span></li><li><a href="/bears-dojo.html">The Bears Dojo</a> <span>5 min</span></li><li><a href="/pal-cam-tv.html">Pal Cam TV</a> <span>All day</span></li></ul></section>
