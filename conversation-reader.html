<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat analyzer</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://spreadloveandacceptance.com/signal-translator.html">
<!-- The Conversation Reader is now part of the Chat analyzer (/signal-translator.html, "A whole conversation or
     screenshot"). This page only sends people there. It keeps the #part of the address, and a conversation
     passed as ?text= goes over in this tab's sessionStorage ('tol-cr-text', removed as soon as it's read), so it
     never stays in the address. With JavaScript off, the refresh below and the link still work. -->
<meta http-equiv="refresh" content="0; url=/signal-translator.html#conversation">
<script>
(function () {
  var KNOWN = /^#(?:conversation|cr-[\w-]+|add-context)$/;
  var h = KNOWN.test(location.hash) ? location.hash : '#conversation';
  try {
    var t = new URLSearchParams(location.search).get('text');
    if (t && t.trim()) sessionStorage.setItem('tol-cr-text', JSON.stringify({ text: t.slice(0, 50000) }));
  } catch (e) {}
  location.replace('/signal-translator.html' + h);
})();
</script>
<style>
  :root{ --bg:#F5EFDE; --ink:#2B2620; --link:#2B5B8C; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1E1B17; --ink:#EDE6D6; --link:#9CC3EE; } }
  :root[data-theme="dark"]{ --bg:#1E1B17; --ink:#EDE6D6; --link:#9CC3EE; }
  body{ margin:0; background:var(--bg); color:var(--ink); font:18px/1.6 Georgia, "Times New Roman", serif; }
  main{ max-width:36rem; margin:0 auto; padding:3rem 16px; }
  h1{ font-size:1.5rem; line-height:1.25; margin:0 0 .6rem; }
  a{ color:var(--link); }
</style>
</head>
<body>
<main>
  <h1>The Conversation Reader is now part of the Chat analyzer</h1>
  <p><a href="/signal-translator.html#conversation">Open the Chat analyzer</a> and choose &ldquo;A whole conversation or screenshot.&rdquo; It reads a pasted chat or a screenshot on your device, and also checks one message before you send it.</p>
</main>
</body>
</html>
