<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random Coloring Page to Print: Tidbit, Sugarfoot and Mandalas</title>
<meta name="description" content="Tap once for a surprise coloring page from the free coloring books: Tidbit and Sugarfoot for kids, mandalas and quiet scenes for grown-ups. Print it on letter paper.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css">
<link rel="stylesheet" href="/assets/css/coloring-page.css">
<script src="/assets/js/site.js" defer></script>
<script src="/assets/js/coloring-pages-data.js" defer></script>
<script src="/assets/js/coloring-page.js" defer></script>
<link rel="canonical" href="https://spreadloveandacceptance.com/coloring-page.html">
</head>
<body class="cp-page" data-no-garden data-no-offer data-no-share data-no-reading data-no-listen data-no-where data-no-related data-no-fullpath data-no-tip data-no-learnplay data-no-cheer data-no-pillars data-no-buddies data-no-pupvisits data-no-brain-break data-no-clip data-no-dives data-no-weather data-no-private-note data-no-line-share data-no-wash data-no-pudcards>
<main class="read is-wide cpg" id="main">
<div class="cpg-top no-bubble">
  <h1 class="cpg-h1">A coloring page, at random</h1>
  <p class="cpg-lead">Every picture comes from the free coloring books. Pick who it is for, tap the button, and print the page on letter paper.</p>
</div>

<div class="cpg-tool no-bubble" data-cp-root>
  <fieldset class="cpg-who">
    <legend>Who is coloring?</legend>
    <div class="cpg-chips" data-cp-chips>
      <label class="cpg-chip"><input type="radio" name="cp-who" value="any" checked><span>Surprise me</span></label>
      <label class="cpg-chip"><input type="radio" name="cp-who" value="little"><span>Little kids <small>3 to 7</small></span></label>
      <label class="cpg-chip"><input type="radio" name="cp-who" value="big"><span>Big kids <small>8 to 12</small></span></label>
      <label class="cpg-chip"><input type="radio" name="cp-who" value="grown"><span>Grown-ups</span></label>
    </div>
  </fieldset>
  <p class="cpg-go-row"><button type="button" class="cpg-go" data-cp-go>Give me a coloring page</button></p>

  <section class="cpg-result" data-cp-result hidden aria-labelledby="cp-cap">
    <figure class="cpg-sheet">
      <img data-cp-img alt="" width="1700" height="2200">
      <figcaption id="cp-cap" class="cpg-cap"><span class="cpg-words" data-cp-words></span><span class="cpg-from" data-cp-from></span></figcaption>
    </figure>
    <div class="cpg-actions">
      <button type="button" class="cpg-btn cpg-btn-main" data-cp-print>Print this page</button>
      <button type="button" class="cpg-btn" data-cp-again>Another one</button>
      <a class="cpg-btn" data-cp-save href="#" download>Save the picture</a>
    </div>
    <p class="cpg-tip">Print on one side of the paper so markers don’t soak through. Want them all? <a data-cp-book href="/book/download.html">Get the whole coloring book</a>, free.</p>
  </section>
  <p class="cpg-sr" aria-live="polite" data-cp-live></p>
</div>

<noscript><p class="cpg-lead">This page needs JavaScript to pick a picture. The whole coloring books are free on <a href="/book/download.html#kids">the downloads page</a>.</p></noscript>
</main>
</body>
</html>
