<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found — The Objective Ledger</title>
<script>
  // Addresses from earlier versions of the site go straight to where the page lives now.
  (function () {
    var MOVED = {
      'wp-02-the-battery-__stress-meter.html': '/workpapers/wp-02-battery-stress-meter.html',
      'wp02-the-battery-__stress-meter.html': '/workpapers/wp-02-battery-stress-meter.html',
      'wp02-asi-matrix.html': '/workpapers/wp-02-battery-stress-meter.html',
      'wp-04-frequency-calibration.html': '/tools/frequency-calibration.html',
      'wp04-deficit-audit.html': '/workpapers/wp-04-deficit-audit.html',
      'wp01.html': '/workpapers/wp-01.html',
      'preface.md': '/book/preface.html',
      'ch01-rf-paradigm.html': '/book/chapter-1.html',
      'ch02-verdict-engine.html': '/book/chapter-2.html',
      'ch03-telemetry-metrics.html': '/book/chapter-3.html',
      'ch04-ocular-vectors.html': '/book/chapter-4.html',
      'ch05-deficit-audit.html': '/book/chapter-5.html',
      'mood-arbitrage-generator.html': '/tools/mood-arbitrage-full.html',
      'curriculum.html': '/index.html#contents',
      'register.html': '/membership.html',
      'join.html': '/membership.html',
      'signin.html': '/membership.html',
      'login.html': '/membership.html'
    };
    var file = decodeURIComponent(location.pathname.split('/').pop() || '').toLowerCase();
    var dest = MOVED[file] || MOVED[file.replace(/\.md$/, '.html')];
    if (dest) location.replace(dest);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css">
<link rel="stylesheet" href="/assets/css/reading.css">
<script src="/assets/js/site.js" defer></script>
<style>
  .lookup{
    display:grid; grid-template-columns:auto 1fr; gap:.25rem 1rem; align-items:baseline;
    margin:-1rem 0 2.25rem; padding:0 0 1rem; border-bottom:1px solid var(--line);
  }
  .lookup dt{ color:var(--ink-soft); font-size:.95rem; }
  .lookup dd{ margin:0; font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:.95rem; overflow-wrap:anywhere; }
  .lookup dd.nil{ font-family:inherit; }

  .suggest{ list-style:none; padding:0; margin:0 0 2.5rem; }
  .suggest li{ max-width:none; margin:0; }
  .suggest a.tol-row{ grid-template-columns:4.2rem 1fr auto; }

  .finder label{ display:block; font-family:"Fraunces", Georgia, serif; font-size:1.25rem; font-weight:600; margin:0 0 .5rem; }
  .finder input{
    width:100%; font:1.05rem "Lora", Georgia, serif; color:var(--ink);
    background:var(--paper); border:1px solid var(--ink-soft); border-radius:var(--radius); padding:.7rem .85rem;
  }
  .finder input:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  .finder .count{ font-size:.9rem; color:var(--ink-soft); margin:.5rem 0 0; min-height:1.4em; }
  .results .tol-index-section{ margin-top:1.5rem; }
  .read .results ol, .read ol.suggest{ padding-left:0; }
  .results mark{ background:none; color:inherit; box-shadow:inset 0 -.4em 0 rgba(168,121,47,.25); }

  .report{ margin-top:3rem; padding-top:1.5rem; border-top:3px double var(--ink); }
  .report h2{ margin-top:0; }
  .report label{ display:block; font-weight:600; font-size:.98rem; margin:1.1rem 0 .35rem; }
  .report .opt{ font-weight:400; color:var(--ink-soft); font-size:.88rem; margin-left:.35rem; }
  .report textarea, .report input[type=email]{
    width:100%; font:1rem/1.5 "Lora", Georgia, serif; color:var(--ink);
    background:var(--paper); border:1px solid var(--ink-soft); border-radius:var(--radius); padding:.65rem .8rem;
  }
  .report textarea:focus-visible, .report input:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  .report .trap{ position:absolute; left:-9999px; width:1px; height:1px; opacity:0; }
  .report-actions{ display:flex; flex-wrap:wrap; align-items:center; gap:.5rem 1rem; margin-top:1.25rem; }
  .report-actions .tol-btn[disabled]{ opacity:.6; cursor:progress; }
  .report-msg{ margin:0 !important; font-size:.95rem; }
  .report-msg.is-ok{ color:var(--credit); }
  .report-msg.is-error{ color:var(--debit); }
</style>
</head>
<body>
<main class="read">

  <header class="read-head">
    <h1>No page at this address</h1>
  </header>

  <dl class="lookup">
    <dt>You asked for</dt><dd id="asked">this address</dd>
    <dt>Found</dt><dd class="nil">No matching page on the site<span id="report-jump" hidden>. <a href="#report">Report a broken link</a></span></dd>
  </dl>

  <div id="suggest-wrap" hidden>
    <h2 style="margin-top:0">Closest matches</h2>
    <ol class="suggest tol-index" id="suggest"></ol>
  </div>

  <div class="finder">
    <label for="find">Find a page</label>
    <input id="find" type="search" autocomplete="off" placeholder="Title, chapter, or number like WP-03">
    <p class="count" id="count" aria-live="polite"></p>
  </div>
  <div class="results tol-index" id="results"></div>

  <section class="report" id="report" hidden aria-labelledby="report-h">
    <h2 id="report-h">Report this broken link</h2>
    <p>If a link sent you here, send a report and it’ll get fixed. The missing address and the page you came from are included automatically.</p>
    <form id="report-form" novalidate>
      <input type="checkbox" name="botcheck" class="trap" tabindex="-1" autocomplete="off" aria-hidden="true">
      <label for="r-msg">What were you looking for? <span class="opt">Optional</span></label>
      <textarea id="r-msg" name="message" rows="3" maxlength="2000"></textarea>
      <label for="r-email">Your email, if you’d like a reply <span class="opt">Optional</span></label>
      <input id="r-email" name="email" type="email" autocomplete="email">
      <div class="report-actions">
        <button class="tol-btn" type="submit">Send report</button>
        <p class="report-msg" id="report-msg" aria-live="polite"></p>
      </div>
    </form>
  </section>

</main>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var TOL = window.TOL;
  if (!TOL) return;

  var path = decodeURIComponent(location.pathname) + location.search;
  document.getElementById('asked').textContent = path;

  // Flatten the site's page list
  var pages = [];
  TOL.sections.forEach(function (s) {
    s.items.forEach(function (it) {
      if (it.href !== '/index.html') pages.push({ it: it, section: s });
    });
  });

  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function key(s) {
    return String(s).toLowerCase().replace(/\.(html?|md)$/, '').replace(/[^a-z0-9]+/g, '')
      .replace(/(\D)0+(\d)/g, '$1$2');
  }
  function tokens(s) {
    return String(s).toLowerCase().replace(/\.(html?|md)$/g, ' ')
      .split(/[^a-z0-9]+/)
      .map(function (t) { return /^\d+$/.test(t) ? String(parseInt(t, 10)) : t; })
      .filter(function (t) { return t && ['html', 'the', 'and', 'of', 'a', 'www', 'index'].indexOf(t) === -1; });
  }

  // A near-exact name (different punctuation, case, or zero-padding) is the same page: go there
  var file = decodeURIComponent(location.pathname.split('/').pop() || '');
  if (file) {
    var k = key(file);
    var hit = pages.filter(function (p) { return key(p.it.href.split('/').pop()) === k; })[0];
    if (hit && hit.it.href !== decodeURIComponent(location.pathname)) { location.replace(hit.it.href); return; }
  }

  // Closest matches: shared words between the address and each page's name
  var asked = tokens(location.pathname);
  var scored = pages.map(function (p) {
    var mine = tokens([p.it.href, p.it.title, p.it.code, p.it.note || ''].join(' '));
    var score = 0;
    asked.forEach(function (t) {
      if (mine.indexOf(t) !== -1) score += t.length > 2 || /^\d+$/.test(t) ? 2 : 1;
      else if (t.length > 4 && mine.some(function (m) { return m.length > 4 && m.slice(0, 5) === t.slice(0, 5); })) score += 2;
    });
    return { p: p, score: score };
  }).filter(function (x) { return x.score >= 2; })
    .sort(function (a, b) { return b.score - a.score; });
  // If more than three pages tie for best, a guess would be arbitrary; leave it to the search box
  var best = scored.length ? scored[0].score : 0;
  if (scored.filter(function (x) { return x.score === best; }).length > 3) scored = [];
  scored = scored.filter(function (x) { return x.score >= best - 1; }).slice(0, 3);

  function row(p, q) {
    var it = p.it;
    function hl(s) {
      s = esc(s);
      if (!q) return s;
      var re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
      return s.replace(re, '<mark>$1</mark>');
    }
    var member = document.body.classList.contains('unlocked');
    return '<li><a class="tol-row" href="' + it.href + '">' +
      '<span class="tol-code">' + hl(it.code || '') + '</span>' +
      '<span class="tol-title">' + hl(it.title) + (it.note ? '<small>' + hl(it.note) + '</small>' : '') + '</span>' +
      '<span class="tol-access">' + (it.paid ? (member ? 'unlocked' : 'members') : '') + '</span></a></li>';
  }

  if (scored.length) {
    document.getElementById('suggest').innerHTML = scored.map(function (x) { return row(x.p); }).join('');
    document.getElementById('suggest-wrap').hidden = false;
  }

  // Live search over every page
  var input = document.getElementById('find');
  var results = document.getElementById('results');
  var count = document.getElementById('count');

  function render() {
    var q = input.value.trim();
    var ql = q.toLowerCase();
    var qk = key(q);
    var shown = 0, html = '';
    TOL.sections.forEach(function (s) {
      var items = pages.filter(function (p) {
        if (p.section !== s) return false;
        if (!q) return true;
        var it = p.it;
        var hay = [it.title, it.code, it.note || '', s.title].join(' ').toLowerCase();
        return hay.indexOf(ql) !== -1 || (qk && key(it.code || '') === qk);
      });
      if (!items.length) return;
      shown += items.length;
      html += '<div class="tol-index-section"><h3>' + esc(s.title) + '</h3><ol>' +
        items.map(function (p) { return row(p, q); }).join('') + '</ol></div>';
    });
    results.innerHTML = html;
    if (!q) count.textContent = 'Every page on the site, ' + shown + ' in all.';
    else if (!shown) count.textContent = 'Nothing on the site matches “' + q + '”. Try a shorter word, or clear the box to see every page.';
    else count.textContent = shown + (shown === 1 ? ' page matches' : ' pages match') + ' “' + q + '”.';
  }
  input.addEventListener('input', render);
  render();

  // ---- Broken-link report (sent through Web3Forms; your address never appears on the page) ----
  var cfg = TOL.config || {};
  var formReady = cfg.formKey && !/PASTE/.test(cfg.formKey);
  var report = document.getElementById('report');
  var contact = document.querySelector('.tol-foot a[href^="mailto:"]');
  if (contact) {
    if (formReady) { contact.href = '#report'; }
    else { contact.remove(); }
  }
  if (formReady) {
    report.hidden = false;
    document.getElementById('report-jump').hidden = false;
    var form = document.getElementById('report-form');
    var msg = document.getElementById('report-msg');
    var btn = form.querySelector('button');
    var sent = false;
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (sent) return;
      var email = form.email.value.trim();
      if (email && !/^\S+@\S+\.\S+$/.test(email)) {
        msg.textContent = 'That email address looks incomplete. Fix it or leave the box empty.';
        msg.className = 'report-msg is-error'; form.email.focus(); return;
      }
      var payload = {
        access_key: cfg.formKey,
        subject: 'Broken link: ' + path,
        from_name: 'spreadloveandacceptance.com 404 page',
        'Missing address': location.origin + path,
        'Came from': document.referrer || 'No referring page (typed, bookmarked, or opened from an app)',
        'Visitor note': form.message.value.trim() || '(none)',
        botcheck: form.botcheck.checked
      };
      if (email) payload.email = email;
      btn.disabled = true; msg.className = 'report-msg'; msg.textContent = 'Sending…';
      fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(payload)
      }).then(function (r) { return r.json(); }).then(function (d) {
        if (!d.success) throw new Error(d.message || 'failed');
        sent = true;
        form.message.disabled = true; form.email.disabled = true;
        btn.textContent = 'Report sent';
        msg.className = 'report-msg is-ok';
        msg.textContent = email ? 'Thanks. The report is on its way, and any reply will go to that address.' : 'Thanks. The report is on its way.';
      }).catch(function () {
        btn.disabled = false;
        msg.className = 'report-msg is-error';
        msg.textContent = 'The report didn’t go through. Check your connection and send it again.';
      });
    });
  }

  // Re-render once the membership check settles, so access marks are right
  new MutationObserver(function () { render(); if (scored.length) document.getElementById('suggest').innerHTML = scored.map(function (x) { return row(x.p); }).join(''); })
    .observe(document.body, { attributes: true, attributeFilter: ['class'] });
});
</script>
</body>
</html>
