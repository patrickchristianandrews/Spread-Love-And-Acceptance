<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frequency Sync Visualizer — The Objective Ledger</title>
<meta name="description" content="Watch your nervous systems synchronize in real-time. A meditative visualization for the 90-second pulse (WP-13).">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  html, body {
    width: 100%;
    height: 100%;
    background: #0a0e13;
    font-family: "Lora", serif;
    color: #f5efde;
    overflow: hidden;
  }

  #canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .ui-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem;
  }

  .header {
    pointer-events: auto;
    text-align: center;
  }

  .header h1 {
    font-size: 1.8rem;
    margin-bottom: 0.5rem;
    font-family: "Fraunces", serif;
    font-weight: 600;
  }

  .header p {
    font-size: 0.95rem;
    color: #a8a8a8;
  }

  .controls-panel {
    pointer-events: auto;
    display: flex;
    gap: 1.5rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .control-group {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    background: rgba(42, 91, 140, 0.15);
    border: 1px solid rgba(42, 91, 140, 0.3);
    padding: 0.75rem 1.25rem;
    border-radius: 8px;
  }

  .control-group label {
    font-size: 0.9rem;
    color: #c9c9c9;
    font-weight: 500;
  }

  .control-group input[type="range"] {
    width: 120px;
    height: 6px;
    cursor: pointer;
  }

  .control-group input[type="number"] {
    width: 70px;
    padding: 0.5rem;
    background: rgba(10, 14, 19, 0.8);
    border: 1px solid rgba(42, 91, 140, 0.5);
    color: #f5efde;
    border-radius: 4px;
    font-size: 0.9rem;
  }

  .control-group button {
    padding: 0.6rem 1.25rem;
    background: #3e6b4c;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.85rem;
    font-weight: 600;
    transition: all 0.2s;
  }

  .control-group button:hover {
    background: #2d5240;
  }

  .stats-panel {
    pointer-events: auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
    max-width: 600px;
    margin: 0 auto;
  }

  .stat-box {
    background: rgba(62, 107, 76, 0.1);
    border: 1px solid rgba(62, 107, 76, 0.3);
    padding: 1rem;
    border-radius: 8px;
    text-align: center;
  }

  .stat-label {
    font-size: 0.8rem;
    color: #8a9ba8;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 0.5rem;
  }

  .stat-value {
    font-size: 1.4rem;
    font-weight: 600;
    color: #3e6b4c;
    font-family: "IBM Plex Mono", monospace;
  }

  .coherence-indicator {
    font-size: 0.85rem;
    color: #8a9ba8;
    margin-top: 0.5rem;
  }

  .footer {
    pointer-events: auto;
    text-align: center;
    font-size: 0.85rem;
    color: #666;
  }

  .footer a {
    color: #2b5b8c;
    text-decoration: none;
  }

  .footer a:hover {
    text-decoration: underline;
  }

  @media (max-width: 768px) {
    .ui-overlay {
      padding: 1rem;
    }

    .header h1 {
      font-size: 1.3rem;
    }

    .stats-panel {
      grid-template-columns: 1fr;
    }

    .controls-panel {
      gap: 1rem;
    }

    .control-group {
      flex-direction: column;
      align-items: flex-start;
    }
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="ui-overlay">
  <div class="header">
    <h1>Frequency Sync Visualizer</h1>
    <p>Watch your nervous systems synchronize during your 90-second pulse</p>
  </div>

  <div style="flex: 1; display: flex; align-items: center; justify-content: center;">
    <div class="stats-panel">
      <div class="stat-box">
        <div class="stat-label">Freq A</div>
        <div class="stat-value" id="stat-freq-a">—</div>
        <div class="coherence-indicator" id="stat-freq-a-label"></div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Delta</div>
        <div class="stat-value" id="stat-delta">—</div>
        <div class="coherence-indicator" id="stat-delta-status"></div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Freq B</div>
        <div class="stat-value" id="stat-freq-b">—</div>
        <div class="coherence-indicator" id="stat-freq-b-label"></div>
      </div>
    </div>
  </div>

  <div>
    <div class="controls-panel">
      <div class="control-group">
        <label>You (Hz)</label>
        <input type="range" id="freq-a" min="0.5" max="3" step="0.1" value="1.5">
        <input type="number" id="freq-a-input" min="0.5" max="3" step="0.1" value="1.5">
      </div>
      <div class="control-group">
        <label>Partner (Hz)</label>
        <input type="range" id="freq-b" min="0.5" max="3" step="0.1" value="1.5">
        <input type="number" id="freq-b-input" min="0.5" max="3" step="0.1" value="1.5">
      </div>
      <div class="control-group">
        <button id="audio-toggle">🔊 Audio On</button>
      </div>
    </div>

    <div class="footer">
      Part of WP-13 (Phase-Locked Loop Protocol) • <a href="/">Back to Framework</a>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Resize canvas
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Frequency controls
const freqARange = document.getElementById('freq-a');
const freqAInput = document.getElementById('freq-a-input');
const freqBRange = document.getElementById('freq-b');
const freqBInput = document.getElementById('freq-b-input');
const audioToggleBtn = document.getElementById('audio-toggle');

// Stats
const statFreqA = document.getElementById('stat-freq-a');
const statFreqB = document.getElementById('stat-freq-b');
const statDelta = document.getElementById('stat-delta');
const statDeltaStatus = document.getElementById('stat-delta-status');

// Audio
let audioCtx;
let oscA, oscB, gainA, gainB, masterGain;
let audioEnabled = false;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.08;
  masterGain.connect(audioCtx.destination);

  oscA = audioCtx.createOscillator();
  gainA = audioCtx.createGain();
  oscA.connect(gainA);
  gainA.connect(masterGain);
  oscA.type = 'sine';
  gainA.gain.value = 0.3;
  oscA.start();

  oscB = audioCtx.createOscillator();
  gainB = audioCtx.createGain();
  oscB.connect(gainB);
  gainB.connect(masterGain);
  oscB.type = 'sine';
  gainB.gain.value = 0.3;
  oscB.start();

  audioEnabled = true;
}

function stopAudio() {
  if (!audioCtx) return;
  try {
    oscA.stop();
    oscB.stop();
    masterGain.disconnect();
  } catch (e) {}
  audioCtx = null;
  audioEnabled = false;
}

// Particle system
class Particle {
  constructor(x, y, vx, vy, color, life) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.color = color;
    this.life = life;
    this.maxLife = life;
    this.size = Math.random() * 3 + 1;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life--;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life / this.maxLife;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

let particles = [];

// Main animation loop
let time = 0;
let freqA = 1.5;
let freqB = 1.5;

function updateFrequencies() {
  freqA = parseFloat(freqARange.value);
  freqAInput.value = freqA.toFixed(1);
  freqBRange.value = freqA;

  freqB = parseFloat(freqBRange.value);
  freqBInput.value = freqB.toFixed(1);
  freqARange.value = freqB;

  // Update audio
  if (audioEnabled && audioCtx) {
    const baseFreq = 110;
    oscA.frequency.setTargetAtTime(baseFreq * freqA, audioCtx.currentTime, 0.05);
    oscB.frequency.setTargetAtTime(baseFreq * freqB, audioCtx.currentTime, 0.05);

    const delta = Math.abs(freqA - freqB) < 0.05 ? 0 : Math.max(freqA, freqB) / Math.min(freqA, freqB);
    if (delta < 1.2) {
      gainA.gain.setTargetAtTime(0.3, audioCtx.currentTime, 0.05);
      gainB.gain.setTargetAtTime(0.3, audioCtx.currentTime, 0.05);
    } else {
      const beatFreq = Math.abs(freqA - freqB) * 2;
      const beatPhase = Math.sin(audioCtx.currentTime * beatFreq * Math.PI * 2);
      gainA.gain.setTargetAtTime(0.15 + beatPhase * 0.15, audioCtx.currentTime, 0.05);
      gainB.gain.setTargetAtTime(0.15 - beatPhase * 0.15, audioCtx.currentTime, 0.05);
    }
  }

  // Update stats
  const delta = Math.abs(freqA - freqB) < 0.05 ? 0 : Math.max(freqA, freqB) / Math.min(freqA, freqB);
  statFreqA.textContent = freqA.toFixed(1);
  statFreqB.textContent = freqB.toFixed(1);
  statDelta.textContent = delta < 0.05 ? '✓' : delta.toFixed(2) + 'x';
  
  if (delta < 0.1) {
    statDeltaStatus.textContent = 'Aligned';
    statDeltaStatus.style.color = '#3e6b4c';
  } else if (delta < 1.5) {
    statDeltaStatus.textContent = 'Close';
    statDeltaStatus.style.color = '#a8792f';
  } else {
    statDeltaStatus.textContent = 'Diverging';
    statDeltaStatus.style.color = '#8b6f47';
  }
}

freqARange.addEventListener('input', () => {
  freqA = parseFloat(freqARange.value);
  freqAInput.value = freqA.toFixed(1);
  updateFrequencies();
});

freqAInput.addEventListener('input', () => {
  freqA = parseFloat(freqAInput.value);
  freqARange.value = freqA;
  updateFrequencies();
});

freqBRange.addEventListener('input', () => {
  freqB = parseFloat(freqBRange.value);
  freqBInput.value = freqB.toFixed(1);
  updateFrequencies();
});

freqBInput.addEventListener('input', () => {
  freqB = parseFloat(freqBInput.value);
  freqBRange.value = freqB;
  updateFrequencies();
});

audioToggleBtn.addEventListener('click', () => {
  if (audioEnabled) {
    stopAudio();
    audioToggleBtn.textContent = '🔇 Audio Off';
    audioToggleBtn.style.background = '#8b6f47';
  } else {
    initAudio();
    updateFrequencies();
    audioToggleBtn.textContent = '🔊 Audio On';
    audioToggleBtn.style.background = '#3e6b4c';
  }
});

function animate() {
  time += 0.016; // ~60fps

  const w = canvas.width;
  const h = canvas.height;
  const centerX = w / 2;
  const centerY = h / 2;

  // Get current frequency delta
  const delta = Math.abs(freqA - freqB) < 0.05 ? 0 : Math.max(freqA, freqB) / Math.min(freqA, freqB);

  // Color scheme based on coherence
  let bgColor, waveColor, particleColor;
  
  if (delta < 0.1) {
    // Aligned: cool, calm blues
    bgColor = '#0a0e13';
    waveColor = '#2b5b8c';
    particleColor = '#3e6b4c';
  } else if (delta < 1.5) {
    // Moderate: transition to warmer
    const t = (delta - 0.1) / 1.4;
    bgColor = `rgb(${10 + t * 20}, ${14 + t * 10}, ${19 + t * 10})`;
    waveColor = `rgb(${43 + t * 100}, ${91 + t * 80}, ${140 - t * 100})`;
    particleColor = `rgb(${62 + t * 80}, ${107 - t * 40}, ${76 + t * 40})`;
  } else {
    // Diverging: warm, alert reds
    bgColor = '#1a0e0a';
    waveColor = '#a85a3a';
    particleColor = '#d97a4a';
  }

  // Clear with gradient
  const gradient = ctx.createLinearGradient(0, 0, 0, h);
  gradient.addColorStop(0, bgColor);
  gradient.addColorStop(1, '#0a0e13');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, w, h);

  // Draw concentric circles based on frequencies
  ctx.strokeStyle = waveColor;
  ctx.globalAlpha = 0.3;

  for (let i = 0; i < 4; i++) {
    const radius = 50 + i * 80 + Math.sin(time * freqA) * 30 + Math.cos(time * freqB) * 30;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Draw wave patterns
  ctx.globalAlpha = 0.5;
  ctx.strokeStyle = waveColor;
  ctx.lineWidth = 1.5;
  
  for (let y = 0; y < h; y += 40) {
    ctx.beginPath();
    for (let x = 0; x < w; x += 5) {
      const waveA = Math.sin((x / 100 + time * freqA) * Math.PI * 2) * 20;
      const waveB = Math.sin((x / 100 + time * freqB) * Math.PI * 2) * 20;
      const py = y + waveA + waveB;
      if (x === 0) ctx.moveTo(x, py);
      else ctx.lineTo(x, py);
    }
    ctx.stroke();
  }

  // Emit particles when frequencies align
  if (delta < 0.2 && Math.random() < 0.3) {
    for (let i = 0; i < 3; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 2 + 1;
      particles.push(new Particle(
        centerX,
        centerY,
        Math.cos(angle) * speed,
        Math.sin(angle) * speed,
        particleColor,
        60
      ));
    }
  }

  // Update and draw particles
  ctx.globalAlpha = 1;
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.update();
    p.draw(ctx);
  });

  ctx.globalAlpha = 1;

  requestAnimationFrame(animate);
}

animate();
updateFrequencies();
</script>

</body>
</html>
