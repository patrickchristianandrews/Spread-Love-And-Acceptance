<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<title>Quicksilver</title>
<style>
  :root { --bg: #0b1020; --panel: #141b31; --soft: #1b2440; --line: #26304f; --text: #e9edf7; --muted: #9aa5c0; --accent: #5ee7f0; --accent-ink: #06222a; --user: #26306a; --danger: #ff7a8a; }
  @media (prefers-color-scheme: light) { :root { --bg: #f6f7fb; --panel: #ffffff; --soft: #eef1f8; --line: #dde2ee; --text: #121829; --muted: #5d6784; --accent: #0f8f9c; --accent-ink: #ffffff; --user: #e3e8ff; --danger: #c02a3e; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; }
  header { display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top) + 10px) 12px 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header .brand { font-weight: 800; letter-spacing: -.01em; flex: 1; display: flex; align-items: center; gap: 8px; }
  .drop { width: 22px; height: 22px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: linear-gradient(135deg, #fff, #9fb0c9 55%, var(--accent)); }
  button, select, textarea { font: inherit; color: inherit; }
  .ib { background: var(--soft); border: 1px solid var(--line); border-radius: 12px; padding: 8px 11px; min-height: 40px; }
  .picks { display: flex; gap: 8px; padding: 8px 12px; overflow-x: auto; border-bottom: 1px solid var(--line); }
  .picks select { background: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; max-width: 70vw; font-size: .9rem; font-weight: 600; }
  main { flex: 1; overflow-y: auto; padding: 14px 12px 4px; -webkit-overflow-scrolling: touch; }
  .msg { margin: 0 0 14px; display: flex; flex-direction: column; }
  .msg.user { align-items: flex-end; }
  .b { max-width: 92%; padding: 10px 14px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); overflow-wrap: anywhere; }
  .msg.user .b { background: var(--user); border-color: transparent; border-bottom-right-radius: 6px; white-space: pre-wrap; }
  .msg.ai .b { border-bottom-left-radius: 6px; }
  .b img { max-width: 100%; border-radius: 12px; display: block; margin-bottom: 6px; }
  .b p { margin: 0 0 .6em; } .b p:last-child { margin: 0; }
  .b pre { background: var(--soft); padding: 10px; border-radius: 10px; overflow-x: auto; font-size: .85rem; }
  .b code { font-family: ui-monospace, Consolas, monospace; font-size: .88em; }
  .b ul, .b ol { margin: 0 0 .6em; padding-left: 1.3em; }
  .b h1, .b h2, .b h3 { font-size: 1.05rem; margin: .4em 0 .3em; }
  .b a { color: var(--accent); }
  .meta { font-size: .75rem; color: var(--muted); margin: 3px 6px 0; }
  .status { color: var(--muted); font-style: italic; }
  .empty { text-align: center; color: var(--muted); margin-top: 22vh; padding: 0 20px; }
  .empty b { display: block; color: var(--text); font-size: 1.3rem; margin-bottom: 6px; }
  footer { padding: 8px 10px calc(env(safe-area-inset-bottom) + 8px); border-top: 1px solid var(--line); background: var(--panel); }
  .composer { display: flex; align-items: flex-end; gap: 8px; }
  textarea { flex: 1; resize: none; max-height: 140px; background: var(--soft); border: 1px solid var(--line); border-radius: 20px; padding: 10px 14px; outline: none; }
  textarea:focus { border-color: var(--accent); }
  .send { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 900; font-size: 1.2rem; flex: none; }
  .send.stop { background: var(--danger); color: #fff; }
  .att { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); border: 1px solid var(--line); flex: none; font-size: 1.2rem; }
  .thumb { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: .85rem; color: var(--muted); }
  .thumb img { width: 44px; height: 44px; object-fit: cover; border-radius: 10px; }
  .gate { margin: auto; padding: 30px 24px; text-align: center; max-width: 420px; }
  .gate h1 { font-size: 1.4rem; }
  .gate p { color: var(--muted); }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 18px; width: min(92vw, 420px); padding: 0; }
  dialog::backdrop { background: rgba(0, 0, 0, .5); }
  .list { max-height: 60vh; overflow-y: auto; }
  .row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 12px 16px; border: 0; border-bottom: 1px solid var(--line); background: none; }
  .row small { color: var(--muted); display: block; }
</style>
</head>
<body>
<header><div class="brand"><span class="drop"></span>Quicksilver</div><button class="ib" id="history" aria-label="Your chats">☰</button><button class="ib" id="new" aria-label="New chat">＋</button></header>
<div class="picks" id="picks" hidden><select id="as" aria-label="Assistant"></select><select id="model" aria-label="Model"></select></div>
<main id="log"></main>
<footer id="foot" hidden>
  <div class="thumb" id="thumb" hidden><img id="thumb-img" alt=""><span>Photo attached</span><button class="ib" id="unthumb" style="min-height:30px;padding:2px 10px">✕</button></div>
  <div class="composer"><label class="att" aria-label="Attach a photo">📷<input type="file" id="file" accept="image/*" hidden></label><textarea id="in" rows="1" placeholder="Message Quicksilver"></textarea><button class="send" id="send" aria-label="Send">↑</button></div>
</footer>
<dialog id="dlg"><div class="list" id="dlg-list"></div><div style="padding:10px 16px;text-align:right"><button class="ib" onclick="document.getElementById('dlg').close()">Close</button></div></dialog>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// The secret comes in the link's #fragment (never sent over the network in the URL) and is kept on this phone.
const fromLink = new URLSearchParams(location.hash.slice(1)).get('k');
if (fromLink) { try { localStorage.setItem('qs-key', fromLink); } catch {} history.replaceState(null, '', '/'); }
let KEY = ''; try { KEY = localStorage.getItem('qs-key') || ''; } catch {}
let info = null;
let chats = []; try { chats = JSON.parse(localStorage.getItem('qs-chats') || '[]'); } catch {}
let cur = null; let busy = null; let photo = null;
const saveChats = () => { try { localStorage.setItem('qs-chats', JSON.stringify(chats.slice(-60))); } catch { chats = chats.slice(-20); } };
const api = (p, o = {}) => fetch(p, { ...o, headers: { ...(o.headers || {}), Authorization: `Bearer ${KEY}`, 'Content-Type': 'application/json' } });

function md(t) {
  const blocks = [];
  let s = esc(t).replace(/```[\w-]*\n([\s\S]*?)```/g, (_, c) => { blocks.push(`<pre><code>${c}</code></pre>`); return `\u0000${blocks.length - 1}\u0000`; });
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|\W)\*([^*\n]+)\*(?=\W|$)/g, '$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out = []; let list = null;
  for (const line of s.split('\n')) {
    const li = line.match(/^\s*(?:[-*+]|(\d+)[.)])\s+(.*)$/);
    if (li) { const tag = li[1] ? 'ol' : 'ul'; if (list !== tag) { if (list) out.push(`</${list}>`); out.push(`<${tag}>`); list = tag; } out.push(`<li>${li[2]}</li>`); continue; }
    if (list) { out.push(`</${list}>`); list = null; }
    const h = line.match(/^#{1,4}\s+(.*)$/);
    if (h) out.push(`<h3>${h[1]}</h3>`); else if (line.trim()) out.push(`<p>${line}</p>`);
  }
  if (list) out.push(`</${list}>`);
  return out.join('').replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[i]);
}

function paint() {
  const log = $('#log');
  if (!cur || !cur.messages.length) { log.innerHTML = `<div class="empty"><b>${info?.name ? `Hi ${esc(info.name)}` : 'Hi'}</b>Your PC does the thinking, privately, with your own models.</div>`; return; }
  log.innerHTML = cur.messages.map((m) => `<div class="msg ${m.role === 'assistant' ? 'ai' : 'user'}"><div class="b">${m.image ? `<img src="${m.image}" alt="">` : ''}${m.role === 'assistant' ? (m.text ? md(m.text.replace(/<think>[\s\S]*?(<\/think>|$)/g, '')) : `<span class="status">${esc(m.status || 'Thinking…')}</span>`) : esc(m.text)}</div>${m.error ? `<div class="meta" style="color:var(--danger)">${esc(m.error)}</div>` : ''}</div>`).join('');
  log.scrollTop = log.scrollHeight;
}

async function load() {
  if (!KEY) return gate('Scan the QR code shown on your PC under <b>Settings → Phone</b> to connect this phone.');
  try {
    const r = await api('/api/info');
    if (r.status === 401) { const e = await r.json(); return gate(esc(e.error)); }
    info = await r.json();
  } catch { return gate('Can\'t reach your PC. Make sure Quicksilver is open on it and this phone is on the same Wi-Fi.', true); }
  $('#as').innerHTML = info.assistants.map((a) => `<option value="${esc(a.id)}">${esc(a.emoji)} ${esc(a.name)}</option>`).join('');
  $('#model').innerHTML = info.targets.map((t) => `<option value="${esc(t.target)}">${esc(t.label)}</option>`).join('');
  $('#as').value = localStorage.getItem('qs-as') || info.assistants[0]?.id || '';
  $('#model').value = localStorage.getItem('qs-model') || info.defaultTarget || info.targets[0]?.target || '';
  $('#picks').hidden = false; $('#foot').hidden = false;
  cur = chats.at(-1) && !chats.at(-1).messages.length ? chats.at(-1) : null;
  paint();
}
function gate(html, retry) {
  $('#picks').hidden = true; $('#foot').hidden = true;
  $('#log').innerHTML = `<div class="gate"><div class="drop" style="margin:0 auto 18px;width:48px;height:48px"></div><h1>Quicksilver on your phone</h1><p>${html}</p>${retry ? '<button class="ib" onclick="load()">Try again</button>' : ''}</div>`;
}

function newChat() { cur = { id: Math.random().toString(36).slice(2, 12), title: '', messages: [], t: Date.now() }; paint(); $('#in').focus(); }
async function sendMsg() {
  if (busy) { busy.abort(); return; }
  const text = $('#in').value.trim();
  if (!text && !photo) return;
  if (!cur) newChat();
  if (!chats.includes(cur)) chats.push(cur);
  cur.messages.push({ role: 'user', text, ...(photo ? { image: photo } : {}) });
  if (!cur.title) cur.title = (text || 'Photo').slice(0, 60);
  $('#in').value = ''; grow(); photo = null; $('#thumb').hidden = true;
  const ans = { role: 'assistant', text: '' };
  cur.messages.push(ans);
  paint(); saveChats();
  busy = new AbortController();
  $('#send').classList.add('stop'); $('#send').textContent = '■';
  try {
    const r = await api('/api/chat', { method: 'POST', signal: busy.signal, body: JSON.stringify({ chatId: cur.id, title: cur.title, assistantId: $('#as').value, target: $('#model').value, messages: cur.messages.slice(0, -1) }) });
    if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || `Error ${r.status}`); }
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!line.startsWith('data: ')) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.t) { ans.text += ev.t; ans.status = ''; } else if (ev.s) ans.status = ev.s; else if (ev.error) ans.error = ev.error;
        paint();
      }
    }
  } catch (err) { if (err.name !== 'AbortError') ans.error = err.message.includes('fetch') ? 'Lost the connection to your PC.' : err.message; }
  busy = null; $('#send').classList.remove('stop'); $('#send').textContent = '↑';
  if (!ans.text && !ans.error) ans.error = 'Stopped.';
  paint(); saveChats();
}
function grow() { const t = $('#in'); t.style.height = 'auto'; t.style.height = `${Math.min(t.scrollHeight, 140)}px`; }
function shrink(file) {
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => { const k = Math.min(1, 1280 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src); res(c.toDataURL('image/jpeg', 0.85)); }; img.onerror = rej; img.src = URL.createObjectURL(file); });
}
$('#in').addEventListener('input', grow);
$('#in').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !('ontouchstart' in window)) { e.preventDefault(); sendMsg(); } });
$('#send').onclick = sendMsg;
$('#new').onclick = newChat;
$('#as').onchange = (e) => localStorage.setItem('qs-as', e.target.value);
$('#model').onchange = (e) => localStorage.setItem('qs-model', e.target.value);
$('#file').onchange = async (e) => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; photo = await shrink(f); $('#thumb-img').src = photo; $('#thumb').hidden = false; };
$('#unthumb').onclick = () => { photo = null; $('#thumb').hidden = true; };
$('#history').onclick = () => {
  const list = [...chats].filter((c) => c.messages.length).reverse();
  $('#dlg-list').innerHTML = list.length ? list.map((c) => `<button class="row" data-c="${c.id}"><span>💬</span><span><b>${esc(c.title || 'Chat')}</b><small>${new Date(c.t).toLocaleString()}</small></span></button>`).join('') : '<p style="padding:16px;color:var(--muted)">No chats yet. They also appear on your PC.</p>';
  $('#dlg').showModal();
};
$('#dlg-list').onclick = (e) => { const b = e.target.closest('[data-c]'); if (b) { cur = chats.find((c) => c.id === b.dataset.c); $('#dlg').close(); paint(); } };
load();
</script>
</body>
</html>
