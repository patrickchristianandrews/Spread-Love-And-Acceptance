<figcaption id="ex-b3-flip-hamish-c"><span class="bk-ex-k">Filled-in example</span> <span class="bk-ex-title">Flip it</span> <span class="bk-ex-who">A 44-year-old after a mistake at work</span></figcaption>
<div class="bk-ex-sheet">
<p class="bk-ex-h">Flip it</p><dl class="bk-ex-f"><div><dt>What’s on your mind?</dt><dd><span class="bk-ex-v">I got the figures wrong in the client report and my manager had to fix it. I’m hopeless at this job.</span></dd></div></dl><div class="bk-ex-q"><p class="bk-ex-ql">What kind is it?</p><ul class="bk-ex-chips"><li>A complaint about someone</li><li>A worry</li><li class="is-on"><span class="bk-ex-sr">Chosen: </span>Being hard on myself</li><li>Anger</li></ul></div><div class="bk-ex-out"><p class="bk-ex-ok">The flip</p><dl><div><dt>What a good friend might say</dt><dd>“That sounds like a hard moment. One mistake is not the whole of you. You’re not hopeless. You’re a person having a hard day.”</dd></div><div><dt>Kinder words for yourself</dt><dd>“I had a hard moment. I’m human. Next time I’ll check the totals once before I send.”</dd></div><div><dt>One next step</dt><dd>A reminder on my phone to check the totals before I send, set tonight.</dd></div></dl><p>Talking to yourself the way you’d talk to a friend is a simple form of self-compassion. Being harsh rarely makes the next try easier. This is a starting point. Change any words you like.</p></div><dl class="bk-ex-f"><div><dt>Their own words, after changing the flip</dt><dd><span class="bk-ex-v">I got two figures wrong and it was caught before the client saw it. I’m human. Next time I’ll ask a colleague to check the numbers before it goes out.</span></dd></div><div><dt>His next step</dt><dd><span class="bk-ex-v">Send my manager a two-line sorry and the checking plan, today, then go home on time.</span></dd></div></dl>
</div>
