actually help in the next hour?</p><ul class="bk-ex-chips"><li>Space</li><li>Food or water</li><li>Rest</li><li>To move</li><li class="is-on"><span class="bk-ex-sr">Chosen: </span>To be heard</li><li class="is-on"><span class="bk-ex-sr">Chosen: </span>A plan</li><li>Company</li><li>Quiet</li><li>Someone to take something off me</li></ul></div><div class="bk-ex-out"><p class="bk-ex-ok">Your forecast</p><dl><div><dt>Gusty today</dt><dd>Revved up · Some room today</dd></div><div><dt>Talk window</dt><dd>wait about 20 minutes</dd></div></dl><p>It’s gusty. You’re revved up. That energy is useful for doing something physical, but it is poor weather for deciding anything about another person.</p><p>The ground underneath: you haven’t eaten in a while and you’re running on caffeine. That isn’t a side note. It’s likely a big part of why today feels the way it does, and it’s easier to change than character is.</p><p>Blowing in: one conversation. Weather from one front tends to land on whoever is nearest, often someone who had nothing to do with it. Worth saying out loud before it does.</p><p>You said what would help is a plan and to be heard. Arrange that before anything else.</p><p>If you want to send someone a line: “I don’t need it solved. I just need you to hear this for a few minutes first.”</p></div>
