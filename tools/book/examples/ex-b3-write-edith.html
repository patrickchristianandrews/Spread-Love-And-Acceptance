<figure class="bk-ex no-bubble no-cheer no-dive" data-no-bubble id="ex-b3-write-edith" aria-labelledby="ex-b3-write-edith-c">
<figcaption id="ex-b3-write-edith-c"><span class="bk-ex-k">Filled-in example</span> <span class="bk-ex-title">Write it through</span> <span class="bk-ex-who">A 74-year-old widow, seven months on, writing to her son and daughter</span></figcaption>
<div class="bk-ex-sheet">
<p class="bk-ex-h">Write it, wait, then send</p><div class="bk-ex-q"><p class="bk-ex-ql">Who is it to?</p><ul class="bk-ex-chips"><li>Partner</li><li>Co-parent or ex</li><li class="is-on"><span class="bk-ex-sr">Chosen: </span>Family</li><li>Friend</li><li>Roommate</li><li>Coworker</li><li>More than one person</li><li>Someone else</li></ul></div><dl class="bk-ex-f is-2"><div><dt>Their name (optional)</dt><dd><span class="bk-ex-v">Malcolm and Fiona</span></dd></div><div><dt>Your name (optional)</dt><dd><span class="bk-ex-v">Mom</span></dd></div></dl><div class="bk-ex-q"><p class="bk-ex-ql">What kind of message?</p><ul class="bk-ex-chips"><li>Raise something</li><li>Reply to something</li><li class="is-on"><span class="bk-ex-sr">Chosen: </span>Make a plan</li><li>Say sorry</li><li>I need a pause</li></ul></div><dl class="bk-ex-f"><div><dt>What we need to plan (one thing)</dt><dd><span class="bk-ex-v">How often we talk and visit. Since your dad died in March, we’ve talked every evening at seven and you’ve visited every Sunday.</span></dd></div></dl><div class="bk-ex-q"><p class="bk-ex-ql">How I feel about it</p><ul class="bk-ex-chips"><li class="is-on"><span class="bk-ex-sr">Chosen: </span>tired</li><li>rushed</li><li>frustrated</li><li>unseen</li><li>taken for granted</li><li>overwhelmed</li><li>stretched thin</li><li>worried</li><li>hurt</li><li>disappointed</li><li>left out</li><li>alone with it</li><li>confused</li><li>embarrassed</li><li>annoyed</li><li>sad</li><li>on edge</li><li>hopeful</li><li class="is-on"><span class="bk-ex-sr">Chosen: </span>grateful</li></ul></div><dl class="bk-ex-f"><div><dt>What I suggest (one clear suggestion)</dt><dd><span class="bk-ex-v">Could we change to Wednesdays and Sundays, and I’ll text you if I need you in between?</span></dd></div><div><dt>What I’m NOT saying (optional, but it helps)</dt><dd><span class="bk-ex-v">I’m not pushing you away. I love hearing from you, and I miss your dad too.</span></dd></div></dl><div class="bk-ex-q"><p class="bk-ex-ql">When I’d like a reply</p><ul class="bk-ex-chips"><li>Today</li><li>Tomorrow</li><li class="is-on"><span class="bk-ex-sr">Chosen: </span>By the weekend</li><li>No rush</li></ul></div><div class="bk-ex-out"><p class="bk-ex-ok">A gentle check</p><p>House rules: ✓ One topic · ✓ Facts, not verdicts · ✓ No always or never · ✓ No sarcasm or ALL CAPS · ✓ No “you” accusations · ✓ Says what you’re asking for · ✓ A reply-by time</p><p>No sharp words found. It reads as calm and clear.</p></div>
</div>
<p class="bk-ex-note">A made-up example. Names and details are invented. Fiona called the same evening: “Of course. Will you still tell us on a bad day?” Edith said she would.</p>
