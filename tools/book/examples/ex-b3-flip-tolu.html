<figure class="bk-ex no-bubble no-cheer no-dive" data-no-bubble id="ex-b3-flip-tolu" aria-labelledby="ex-b3-flip-tolu-c">
<figcaption id="ex-b3-flip-tolu-c"><span class="bk-ex-k">Filled-in example</span> <span class="bk-ex-title">Flip it</span> <span class="bk-ex-who">A 17-year-old at 1am, three days before an exam</span></figcaption>
<div class="bk-ex-sheet">
<p class="bk-ex-h">Flip it</p><dl class="bk-ex-f"><div><dt>What’s on your mind?</dt><dd><span class="bk-ex-v">What if I fail my biology exam on Friday and don’t get into the course I want?</span></dd></div></dl><div class="bk-ex-q"><p class="bk-ex-ql">What kind is it?</p><ul class="bk-ex-chips"><li>A complaint about someone</li><li class="is-on"><span class="bk-ex-sr">Chosen: </span>A worry</li><li>Being hard on myself</li><li>Anger</li></ul></div><div class="bk-ex-out"><p class="bk-ex-ok">The flip</p><dl><div><dt>The best outcome would be</dt><dd>I walk out knowing I did what I could.</dd></div><div><dt>The main thing in the way</dt><dd>I fail my biology exam on Friday and don’t get into the course I want</dd></div><div><dt>If that happens, I’ll</dt><dd>take a breath and start with the questions I know.</dd></div><div><dt>One step today</dt><dd>Do one past-paper question, ten minutes, then go to sleep.</dd></div></dl><p>This is WOOP, from Gabriele Oettingen’s research: Wish, Outcome, Obstacle, Plan. The worry becomes the obstacle you plan for. This is a starting point. Change any words you like.</p></div><dl class="bk-ex-f"><div><dt>A 17-year-old’s version</dt><dd><span class="bk-ex-v">Best outcome: I pass, and I feel I did my best. In the way: I freeze on the long questions. If that happens, I’ll do the short questions first and come back. One step today: one long question from a past paper, then bed.</span></dd></div><div><dt>When the worry comes back at 1am</dt><dd><span class="bk-ex-v">It goes on the list for tomorrow’s worry time, 5pm, ten minutes.</span></dd></div></dl>
</div>
<p class="bk-ex-note">A made-up example. Names and details are invented. If worry is keeping you from sleeping or eating most days, tell someone you trust.</p>
