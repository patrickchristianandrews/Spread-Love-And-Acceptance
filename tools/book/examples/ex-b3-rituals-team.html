<figcaption id="ex-b3-rituals-team-c"><span class="bk-ex-k">Filled-in example</span> <span class="bk-ex-title">Keep your little rituals alive</span> <span class="bk-ex-who">Lachlan and Sunita, who lead a hybrid team of nine together</span></figcaption>
<div class="bk-ex-sheet">
<p class="bk-ex-h">Keep your little rituals alive</p><dl class="bk-ex-f is-2"><div><dt>Person A</dt><dd><span class="bk-ex-v">Lachlan</span></dd></div><div><dt>Person B</dt><dd><span class="bk-ex-v">Sunita</span></dd></div><div><dt>Date</dt><dd><span class="bk-ex-v">October 2, 2026</span></dd></div></dl><p class="bk-ex-part">Part A: Our rituals, big and small</p><div class="bk-ex-tw"><table class="bk-ex-t no-bubble"><thead><tr><th scope="col">Ritual or habit</th><th scope="col">How often</th><th scope="col">How it’s doing</th><th scope="col">What it gives us, or what got in the way</th></tr></thead><tbody><tr><td data-label="Ritual or habit"><span class="bk-ex-v">Monday coffee call, cameras optional</span></td><td data-label="How often"><span class="bk-ex-v">Weekly</span></td><td data-label="How it’s doing"><span class="bk-ex-v">Fading</span></td><td data-label="What it gives us, or what got in the way"><span class="bk-ex-v">Half the team stopped coming when it moved to 8:30</span></td></tr><tr><td data-label="Ritual or habit"><span class="bk-ex-v">Friday “one good thing” round in the team chat</span></td><td data-label="How often"><span class="bk-ex-v">Weekly</span></td><td data-label="How it’s doing"><span class="bk-ex-v">Alive</span></td><td data-label="What it gives us, or what got in the way"><span class="bk-ex-v">Five minutes; people notice each other’s work</span></td></tr><tr><td data-label="Ritual or habit"><span class="bk-ex-v">A card and lunch when someone leaves</span></td><td data-label="How often"><span class="bk-ex-v">Now and then</span></td><td data-label="How it’s doing"><span class="bk-ex-v">Alive</span></td><td data-label="What it gives us, or what got in the way"><span class="bk-ex-v">People leave feeling thanked</span></td></tr><tr><td data-label="Ritual or habit"><span class="bk-ex-v">Office day with lunch together</span></td><td data-label="How often"><span class="bk-ex-v">Monthly</span></td><td data-label="How it’s doing"><span class="bk-ex-v">Stopped</span></td><td data-label="What it gives us, or what got in the way"><span class="bk-ex-v">Stopped when the office moved; the three who work from home felt like guests</span></td></tr><tr><td data-label="Ritual or habit"><span class="bk-ex-v">Hello and goodbye in the chat, start and end of day</span></td><td data-label="How often"><span class="bk-ex-v">Daily</span></td><td data-label="How it’s doing"><span class="bk-ex-v">New idea</span></td><td data-label="What it gives us, or what got in the way"><span class="bk-ex-v">So nobody wonders who’s around</span></td></tr></tbody></table></div><div class="bk-ex-out"><p class="bk-ex-ok">Part B: Where your rituals stand</p><dl><div><dt>Your rituals</dt><dd>5 rituals listed. Alive: 2 · Fading: 1 · Stopped: 1 · New idea: 1.</dd></div><div><dt>Fading or stopped</dt><dd>Monday coffee call, cameras optional, Office day with lunch together.</dd></div><div><dt>New ideas</dt><dd>Hello and goodbye in the chat, start and end of day.</dd></div></dl><p>Rituals lapse for ordinary reasons: a new job, a baby, a move, an illness, a hard year. A stopped one isn’t a failure. Pick one to restart below, or let it go on purpose.</p></div><p class="bk-ex-part">Part C: One to restart, or start</p><dl class="bk-ex-f"><div><dt>The ritual</dt><dd><span class="bk-ex-v">Monday coffee call</span></dd></div><div><dt>The smallest version that still counts</dt><dd><span class="bk-ex-v">Ten minutes at 9:15, no work talk, cameras optional</span></dd></div><div><dt>The first time: when, and who will suggest it</dt><dd><span class="bk-ex-v">Next Monday; Sunita sends the invite</span></dd></div><div><dt>What would make it easy to skip, and how we’ll protect it (optional)</dt><dd><span class="bk-ex-v">A busy week. We keep it then too, just shorter.</span></dd></div></dl><p class="bk-ex-part">Part D (optional): One to let go, with thanks</p><dl class="bk-ex-f is-2"><div><dt>The ritual</dt><dd><span class="bk-ex-v">Office day with lunch together</span></dd></div><div><dt>What it gave us</dt><dd><span class="bk-ex-v">A day all together, back when we all lived near the office</span></dd></div></dl>
</div>
<p class="bk-ex-note">A made-up example. Names and details are invented. The sheet is written for couples and families, and it works for a team: the rituals are what make a group feel like one.</p>
