# Builds the Open Studio Android app (Open-Studio-<version>.apk) with Capacitor + Gradle,
# then publishes it as a GitHub release. A debug APK you sideload (Settings → allow unknown sources).
name: Open Studio Android

on:
  push:
    paths:
      - 'open-studio-android/**'
      - '.github/workflows/open-studio-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: open-studio-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: open-studio-android
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Sync web assets into the Android project
        run: npx cap sync android
      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Read version
        id: ver
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build the APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Name it
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Open-Studio-${{ steps.ver.outputs.v }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Open-Studio-Android-apk
          path: open-studio-android/Open-Studio-*.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish release
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: open-studio-android-v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Open Studio Android ${{ steps.ver.outputs.v }}
          files: open-studio-android/Open-Studio-*.apk
