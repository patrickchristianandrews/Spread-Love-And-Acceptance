# Builds the FaceLens Windows app (windows-apps/facelens): a portable zip and FaceLens-Setup.exe.
# Runs when FaceLens changes, on demand from the Actions tab, and when a facelens-v* tag is pushed
# (a tag like facelens-v1.0.0 also publishes the build as a GitHub release).
name: FaceLens Windows app

on:
  push:
    paths: ['windows-apps/facelens/**', '.github/workflows/facelens-windows.yml']
    tags: ['facelens-v*']
  workflow_dispatch:

concurrency:
  group: facelens-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
        working-directory: windows-apps/facelens
    env:
      PYTHONIOENCODING: utf-8
      TF_CPP_MIN_LOG_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: windows-apps/facelens/requirements.txt

      - name: Version
        run: |
          $v = '1.0.0'
          if ('${{ github.ref }}' -like 'refs/tags/facelens-v*') { $v = '${{ github.ref_name }}'.Substring(10) }
          "FACELENS_VERSION=$v" | Out-File -Append $env:GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip freeze

      - name: Test photos (from the DeepFace test set)
        run: |
          New-Item -ItemType Directory -Force test-photos | Out-Null
          foreach ($n in 'img1', 'img2') {
            Invoke-WebRequest "https://raw.githubusercontent.com/serengil/deepface/master/tests/unit/dataset/$n.jpg" -OutFile "test-photos/$n.jpg"
          }

      - name: Self-test from source
        run: python facelens.py --self-test test-photos/img1.jpg test-photos/img2.jpg

      - name: Build FaceLens.exe
        run: python -m PyInstaller --noconfirm --clean facelens.spec

      - name: Self-test the built exe
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'FaceLens\facelens.log'
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process dist\FaceLens\FaceLens.exe -ArgumentList '--self-test', 'test-photos\img1.jpg', 'test-photos\img2.jpg' -Wait -PassThru
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          if ($p.ExitCode -ne 0) { throw "FaceLens.exe self-test failed with exit code $($p.ExitCode)" }
          $size = (Get-ChildItem dist\FaceLens -Recurse | Measure-Object Length -Sum).Sum / 1MB
          "Build size: {0:N0} MB" -f $size

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
          Move-Item dist\FaceLens-Setup.exe "dist\FaceLens-Setup-$env:FACELENS_VERSION.exe"
          Compress-Archive -Path dist\FaceLens -DestinationPath "dist\FaceLens-portable-$env:FACELENS_VERSION.zip"
          Get-ChildItem dist -File | Format-Table Name, @{n='MB';e={[math]::Round($_.Length / 1MB)}}

      - uses: actions/upload-artifact@v4
        with:
          name: FaceLens-Setup-${{ env.FACELENS_VERSION }}
          path: windows-apps/facelens/dist/FaceLens-Setup-*.exe
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: FaceLens-portable-${{ env.FACELENS_VERSION }}
          path: windows-apps/facelens/dist/FaceLens-portable-*.zip
          compression-level: 0

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/facelens-v')
        uses: softprops/action-gh-release@v2
        with:
          name: FaceLens ${{ env.FACELENS_VERSION }}
          body: |
            FaceLens for Windows (64-bit): face analysis, verification, search and live webcam analysis, powered by DeepFace.
            Download **FaceLens-Setup** to install, or the **portable** zip to run without installing.
            Models download on first use (to %USERPROFILE%\.deepface\weights).
          files: |
            windows-apps/facelens/dist/FaceLens-Setup-*.exe
            windows-apps/facelens/dist/FaceLens-portable-*.zip
