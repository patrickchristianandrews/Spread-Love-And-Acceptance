# Builds the Quicksilver Windows installer (Quicksilver-Setup-x.y.z.exe).
#  1. tests:   the back-end and end-to-end tests (Linux, with stand-in engines)
#  2. windows: downloads the official llama.cpp and stable-diffusion.cpp builds, proves the real
#              text engine loads a model and answers, then builds and uploads the installer.
# Runs on every push that changes quicksilver/, and on demand from the Actions tab.
# Pushing a tag like quicksilver-v2.0.0 also publishes the installer as a GitHub release.
name: Quicksilver Windows installer

on:
  push:
    paths: ['quicksilver/**', '.github/workflows/quicksilver-windows.yml']
    tags: ['quicksilver-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quicksilver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quicksilver/package-lock.json
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg xvfb
          npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Back-end tests
        run: node test/backend.test.js
      - name: End-to-end tests
        run: xvfb-run -a node test/ui.test.js

  windows:
    needs: tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: quicksilver
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quicksilver/package-lock.json

      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Download the engines (llama.cpp + stable-diffusion.cpp)
        run: node scripts/fetch-engines.js --platform win32
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prove the real text engine loads a model and answers
        run: |
          SERVER=$(find engine/llama -name llama-server.exe | head -1)
          echo "engine: $SERVER ($(cat engine/llama/VERSION.txt))"
          "$SERVER" --list-devices || true
          "$SERVER" -m test/fixtures/tiny.gguf --host 127.0.0.1 --port 8099 -c 512 -ngl 0 --jinja --cache-reuse 256 --device none > llama.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8099/health && break; sleep 1; done
          RESPONSE=$(curl -sf http://127.0.0.1:8099/v1/chat/completions -H "Content-Type: application/json" -d '{"messages":[{"role":"user","content":"Hello"}],"max_tokens":8}')
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"choices"' || { cat llama.log; exit 1; }
          taskkill //F //IM llama-server.exe || true

      - name: Download the models that come with Quicksilver
        run: node scripts/fetch-starter.js

      - name: Prove each bundled model answers correctly (and sees images) on the processor
        run: node scripts/prove-starter.js "$(find engine/llama -name llama-server.exe | head -1)"

      - name: Check the image engine starts
        run: |
          SD=$(find engine/sd \( -name sd-cli.exe -o -name sd.exe \) | head -1)
          echo "engine: $SD ($(cat engine/sd/VERSION.txt))"
          "$SD" --help | head -5

      # Signing removes Windows' "unknown publisher" warning. It turns on by itself once either
      # set of repository secrets exists (Settings → Secrets and variables → Actions):
      #   Azure Trusted Signing: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
      #                          AZURE_SIGN_ENDPOINT, AZURE_SIGN_ACCOUNT, AZURE_SIGN_PROFILE, AZURE_SIGN_PUBLISHER
      #   or a certificate file: WIN_CSC_LINK (base64 of the .pfx) and WIN_CSC_KEY_PASSWORD
      - name: Build installer
        run: |
          ARGS=(--win --publish never)
          if [ -n "$AZURE_CLIENT_ID" ]; then
            echo "Signing with Azure Trusted Signing"
            ARGS+=("-c.win.azureSignOptions.publisherName=$AZURE_SIGN_PUBLISHER" "-c.win.azureSignOptions.endpoint=$AZURE_SIGN_ENDPOINT" "-c.win.azureSignOptions.codeSigningAccountName=$AZURE_SIGN_ACCOUNT" "-c.win.azureSignOptions.certificateProfileName=$AZURE_SIGN_PROFILE")
          elif [ -n "$CSC_LINK" ]; then
            echo "Signing with the code-signing certificate"
          else
            echo "::warning::Installer is not code-signed, so Windows will show an 'unknown publisher' warning. See the comments in this workflow to turn on signing."
            unset CSC_LINK CSC_KEY_PASSWORD
          fi
          npx electron-builder "${ARGS[@]}"
          # A Windows installer can't be larger than about 2 GB.
          for f in dist/*.exe; do s=$(stat -c %s "$f"); echo "$f: $((s / 1048576)) MB"; [ "$s" -lt 2100000000 ] || { echo "::error::$f is too big for a Windows installer"; exit 1; }; done
          # Quicksilver's full model ships next to the installer, which copies it in.
          mkdir -p "dist/Quicksilver models"
          cp pack/* "dist/Quicksilver models/"
          VERSION=$(node -p "require('./package.json').version")
          printf 'Installing Quicksilver\r\n\r\n1. Unzip everything into one folder.\r\n2. Run Quicksilver-Setup-%s.exe. Keep the "Quicksilver models" folder next to it:\r\n   the installer copies the full Quicksilver model from there, so it works offline right away.\r\n\r\nIf you only have the setup file, that is fine too: Quicksilver starts with its small model\r\nand downloads the rest in the background the first time it runs.\r\n' "$VERSION" > "dist/READ ME FIRST.txt"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ secrets.AZURE_SIGN_PUBLISHER }}

      - uses: actions/upload-artifact@v4
        with:
          name: Quicksilver-Windows-installer
          path: |
            quicksilver/dist/*.exe
            quicksilver/dist/Quicksilver models/
            quicksilver/dist/READ ME FIRST.txt
          if-no-files-found: error

      # Install it and use it the way a new user would: real installer, real engine, the models that
      # come with Quicksilver, real questions. A failure here fails the build.
      - name: Install with the models folder and use it like a new user
        shell: pwsh
        timeout-minutes: 30
        run: |
          $setup = Get-ChildItem dist\Quicksilver-Setup-*.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S','/D=C:\QS'
          if (!(Test-Path 'C:\QS\Quicksilver.exe')) { throw 'Quicksilver.exe was not installed' }
          if (!(Test-Path 'C:\QS\resources\engine\llama\llama-server.exe')) { throw 'the text engine is missing' }
          foreach ($f in 'STARTER.json','model.gguf','mmproj.gguf','qwen3-4b-instruct-2507.gguf') { if (!(Test-Path "C:\QS\resources\starter\$f")) { throw "missing resources\starter\$f" } }
          Get-ChildItem C:\QS\resources\starter | ForEach-Object { '{0,-34} {1,8:N0} MB' -f $_.Name, ($_.Length / 1MB) }
          Write-Host '✓ installed, and the installer copied the Quicksilver model in'
          node test/installed.test.js C:\QS\Quicksilver.exe full install-shots
          if ($LASTEXITCODE -ne 0) { throw 'the installed app test failed' }

      - name: Install from the setup file alone, then uninstall
        shell: pwsh
        timeout-minutes: 40
        run: |
          New-Item -ItemType Directory -Force C:\lonely | Out-Null
          $setup = Get-ChildItem dist\Quicksilver-Setup-*.exe | Select-Object -First 1
          Copy-Item $setup.FullName C:\lonely\
          Start-Process -Wait -FilePath (Join-Path C:\lonely $setup.Name) -ArgumentList '/S','/D=C:\QS2'
          if (!(Test-Path 'C:\QS2\Quicksilver.exe')) { throw 'Quicksilver.exe was not installed' }
          if (Test-Path 'C:\QS2\resources\starter\qwen3-4b-instruct-2507.gguf') { throw 'without the folder, the main model should not be installed' }
          node test/installed.test.js C:\QS2\Quicksilver.exe fallback install-shots
          if ($LASTEXITCODE -ne 0) { throw 'the installed app test failed' }
          $un = Get-ChildItem 'C:\QS2\Uninstall*.exe' | Select-Object -First 1
          Start-Process -Wait -FilePath $un.FullName -ArgumentList '/S'
          for ($i = 0; $i -lt 90 -and (Test-Path 'C:\QS2\Quicksilver.exe'); $i++) { Start-Sleep 1 }
          if (Test-Path 'C:\QS2\Quicksilver.exe') { throw 'uninstalling left the app behind' }
          Write-Host '✓ uninstalled cleanly'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Quicksilver-install-test-screenshots
          path: quicksilver/install-shots/
          if-no-files-found: ignore

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/quicksilver-v')
        uses: softprops/action-gh-release@v2
        with:
          files: quicksilver/dist/*.exe
          name: Quicksilver ${{ github.ref_name }}
