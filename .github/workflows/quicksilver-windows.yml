# Builds the Quicksilver Windows installer (Quicksilver-Setup-x.y.z.exe).
# Runs on every push that changes quicksilver/, and on demand from the Actions tab.
# Pushing a tag like quicksilver-v1.0.0 also publishes the installer as a GitHub release.
name: Quicksilver Windows installer

on:
  push:
    paths: ['quicksilver/**', '.github/workflows/quicksilver-windows.yml']
    tags: ['quicksilver-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: quicksilver
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quicksilver/package-lock.json

      - name: Install
        run: npm ci

      - name: Build installer
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Check the local engine loads on Windows
        shell: bash
        run: |
          node -e "import('node-llama-cpp').then(async (m) => { const l = await m.getLlama({ gpu: 'auto', build: 'never' }); console.log('engine ok, gpu:', l.gpu); process.exit(0); })"

      - uses: actions/upload-artifact@v4
        with:
          name: Quicksilver-Windows-installer
          path: quicksilver/dist/*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/quicksilver-v')
        uses: softprops/action-gh-release@v2
        with:
          files: quicksilver/dist/*.exe
          name: Quicksilver ${{ github.ref_name }}
