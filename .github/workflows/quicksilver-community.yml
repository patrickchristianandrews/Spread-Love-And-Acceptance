# User-submitted stacks for Quicksilver.
# People publish a custom AI from the app: it opens a GitHub issue labelled "stack-submission"
# with the stack as JSON. When a maintainer adds the "approved" label, this checks the stack and
# adds it to quicksilver/data/community.json, which every Quicksilver reads once a day.
# Only people who can label issues (maintainers) can approve. The issue text is passed in
# environment variables and parsed as data, never run.
name: Quicksilver user-submitted stacks

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: quicksilver-community
  cancel-in-progress: false

jobs:
  add:
    if: github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'stack-submission')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: quicksilver
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the stack and add it to the list
        id: add
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: node quicksilver/scripts/add-community.js
      - name: Publish the updated list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quicksilver/data/community.json
          git commit -m "Add a user-submitted stack (issue #${{ github.event.issue.number }})" || exit 0
          git push
      - name: Tell the person and close the issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body: "Thank you! It's now listed under Stacks & Fusion → User-submitted in Quicksilver (it reaches everyone within a day)." });
            await github.rest.issues.update({ ...context.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'completed' });
      - name: Explain what went wrong
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body: "This stack couldn't be added automatically. See the workflow run for the reason: " + `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
