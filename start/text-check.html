<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check a Text Before You Send It: the Chat Analyzer</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://spreadloveandacceptance.com/signal-translator.html">
<!-- nav21: "Check a text before you send it" now lives in one place, the Chat analyzer (/signal-translator.html), as its
     first way in ("Check a text before you send it"). This page only sends people there, so old links, ads and QR codes
     keep working. A message passed as ?text= goes over in this tab's sessionStorage ('tol-st-text', removed as soon as
     the analyzer reads it), so it never stays in the address. With JavaScript off, the refresh below and the link work. -->
<meta http-equiv="refresh" content="0; url=/signal-translator.html#send">
<script>
(function () {
  try {
    var t = new URLSearchParams(location.search).get('text');
    if (t && t.trim()) sessionStorage.setItem('tol-st-text', t.slice(0, 1500));
  } catch (e) {}
  location.replace('/signal-translator.html#send');
})();
</script>
<style>
  :root{ --bg:#F5EFDE; --ink:#2B2620; --link:#2B5B8C; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1E1B17; --ink:#EDE6D6; --link:#9CC3EE; } }
  :root[data-theme="dark"]{ --bg:#1E1B17; --ink:#EDE6D6; --link:#9CC3EE; }
  body{ margin:0; background:var(--bg); color:var(--ink); font:18px/1.6 Georgia, "Times New Roman", serif; }
  main{ max-width:36rem; margin:0 auto; padding:3rem 16px; }
  h1{ font-size:1.5rem; line-height:1.25; margin:0 0 .6rem; }
  a{ color:var(--link); display:inline-block; min-height:44px; }
</style>
</head>
<body>
<main>
  <h1>Check a text before you send it</h1>
  <p>This is now part of the Chat analyzer, so everything for a tense message is in one place. <a href="/signal-translator.html#send">Open the Chat analyzer</a> and type or paste your text. It reads the words on your device, and nothing is saved or sent.</p>
</main>
</body>
</html>
