<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 780" width="540" height="780" role="img" aria-labelledby="fig-ch4-steps-t fig-ch4-steps-d" font-family="Lora, Georgia, serif" fill="#2B2620">
<title id="fig-ch4-steps-t">Let a comment land: notice, name, decide</title>
<desc id="fig-ch4-steps-d">Three steps. Notice: a comment landed harder than its words probably deserved; you often feel it in the body first. Name it out loud: &quot;I heard that as bigger than it probably was. Give me a second.&quot; Decide, once settled: reply now, later or not at all. Below, keep two questions apart. &quot;Was this job done?&quot; is a fact, checked against the job list. &quot;Did that land as an attack?&quot; is a reaction, checked against your own state.</desc>
<defs><marker id="fig-ch4-steps-ar-5a5346" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#5A5346"/></marker></defs>
<rect x="1" y="1" width="538" height="778" rx="20" fill="#FCF9F1" stroke="#D9CBA3" stroke-width="2"/>
<text x="28" y="46" font-size="25" font-weight="bold" fill="#7A5620">Let a comment land</text>
<text x="28" y="76" font-size="19" font-style="italic" fill="#5A5346"><tspan x="28" dy="0">Timing, not hiding: let the spike pass before you</tspan><tspan x="28" dy="24.32">decide.</tspan></text>
<rect x="28" y="122.32" width="484" height="98.32" rx="14" fill="#DCEAF6" stroke="#2F5F8A" stroke-width="1.5"/>
<circle cx="58" cy="171.48" r="17" fill="#2F5F8A"/>
<text x="58" y="178.48" font-size="19" font-weight="bold" fill="#FCF9F1" text-anchor="middle">1</text>
<text x="88" y="153.12" font-size="21" font-weight="bold">Notice</text>
<text x="88" y="178.12" font-size="19" fill="#5A5346"><tspan x="88" dy="0">It landed harder than its words. Hot face,</tspan><tspan x="88" dy="24.32">tight chest, a sharp breath.</tspan></text>
<line x1="58" y1="223.64" x2="58" y2="243.64" stroke="#5A5346" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fig-ch4-steps-ar-5a5346)"/>
<rect x="28" y="248.64" width="484" height="98.32" rx="14" fill="#F1E2C2" stroke="#7A5620" stroke-width="1.5"/>
<circle cx="58" cy="297.8" r="17" fill="#7A5620"/>
<text x="58" y="304.8" font-size="19" font-weight="bold" fill="#FCF9F1" text-anchor="middle">2</text>
<text x="88" y="279.44" font-size="21" font-weight="bold">Name it out loud</text>
<text x="88" y="304.44" font-size="19" fill="#5A5346"><tspan x="88" dy="0">“I heard that as bigger than it probably</tspan><tspan x="88" dy="24.32">was. Give me a second.”</tspan></text>
<line x1="58" y1="349.96" x2="58" y2="369.96" stroke="#5A5346" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fig-ch4-steps-ar-5a5346)"/>
<rect x="28" y="374.96" width="484" height="98.32" rx="14" fill="#DCE7D8" stroke="#3E6B4C" stroke-width="1.5"/>
<circle cx="58" cy="424.12" r="17" fill="#3E6B4C"/>
<text x="58" y="431.12" font-size="19" font-weight="bold" fill="#FCF9F1" text-anchor="middle">3</text>
<text x="88" y="405.76" font-size="21" font-weight="bold">Decide, once settled</text>
<text x="88" y="430.76" font-size="19" fill="#5A5346"><tspan x="88" dy="0">Reply now, later, or not at all. Could a</tspan><tspan x="88" dy="24.32">kinder meaning fit?</tspan></text>
<text x="28" y="513.28" font-size="21" font-weight="bold" fill="#7A5620">Keep the two questions apart</text>
<rect x="28" y="529.28" width="235" height="151.36" rx="14" fill="#DCEAF6" stroke="#2F5F8A" stroke-width="1.5"/>
<text x="42" y="561.28" font-size="19" font-weight="bold"><tspan x="42" dy="0">“Was this job</tspan><tspan x="42" dy="24.32">done?”</tspan></text>
<text x="42" y="613.6" font-size="19" font-weight="bold" fill="#2F5F8A">A fact.</text>
<text x="42" y="641.6" font-size="18" fill="#5A5346"><tspan x="42" dy="0">Check the job list and</tspan><tspan x="42" dy="23.04">its owner.</tspan></text>
<rect x="277" y="529.28" width="235" height="151.36" rx="14" fill="#F7DEE0" stroke="#8E3B47" stroke-width="1.5"/>
<text x="291" y="561.28" font-size="19" font-weight="bold"><tspan x="291" dy="0">“Did that land as</tspan><tspan x="291" dy="24.32">an attack?”</tspan></text>
<text x="291" y="613.6" font-size="19" font-weight="bold" fill="#8E3B47">A reaction.</text>
<text x="291" y="641.6" font-size="18" fill="#5A5346"><tspan x="291" dy="0">Check your own state</tspan><tspan x="291" dy="23.04">first.</tspan></text>
<text x="28" y="707.64" font-size="18" font-style="italic" fill="#5A5346"><tspan x="28" dy="0">Naming a feeling (affect labeling) and looking for</tspan><tspan x="28" dy="23.04">another meaning (reappraisal) both have some</tspan><tspan x="28" dy="23.04">research behind them.</tspan></text>
</svg>
