<text x="512" y="180.32" font-size="19" font-weight="bold" fill="#8E3B47" text-anchor="end">short 0.16</text>
<rect x="28" y="190.32" width="480" height="34" rx="8" fill="#F7DEE0" stroke="#8E3B47" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="28" y="190.32" width="288" height="34" rx="8" fill="#7FB2E0"/>
<text x="40" y="213.32" font-size="18" font-weight="bold">0.24 of 0.40</text>
<text x="28" y="246.32" font-size="18" font-style="italic" fill="#5A5346">how the hours split</text>
<text x="28" y="278.32" font-size="20" font-weight="bold" fill="#7A5620">Ownership clarity</text>
<text x="512" y="278.32" font-size="19" font-weight="bold" fill="#8E3B47" text-anchor="end">short 0.07</text>
<rect x="28" y="288.32" width="420" height="34" rx="8" fill="#F7DEE0" stroke="#8E3B47" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="28" y="288.32" width="336" height="34" rx="8" fill="#D9B46A"/>
<text x="40" y="311.32" font-size="18" font-weight="bold">0.28 of 0.35</text>
<text x="28" y="344.32" font-size="18" font-style="italic" fill="#5A5346">a name on every job</text>
<text x="28" y="376.32" font-size="20" font-weight="bold" fill="#3E6B4C">Leftover stress</text>
<text x="512" y="376.32" font-size="19" font-weight="bold" fill="#8E3B47" text-anchor="end">short 0.10</text>
<rect x="28" y="386.32" width="300" height="34" rx="8" fill="#F7DEE0" stroke="#8E3B47" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="28" y="386.32" width="180" height="34" rx="8" fill="#8FB59A"/>
<text x="40" y="409.32" font-size="18" font-weight="bold">0.15 of 0.25</text>
<text x="28" y="442.32" font-size="18" font-style="italic" fill="#5A5346">how full each tank is</text>
<text x="28" y="484.32" font-size="20" font-weight="bold">Add them up: 0.24 + 0.28 + 0.15 = 0.67</text>
<rect x="28" y="532.32" width="193.6" height="30" rx="0" fill="#F7DEE0" stroke="#D9CBA3" stroke-width="1"/>
<text x="124.8" y="586.32" font-size="18" font-style="italic" fill="#5A5346" text-anchor="middle">needs a rethink</text>
