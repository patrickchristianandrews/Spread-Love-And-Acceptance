<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 762" width="540" height="762" role="img" aria-labelledby="fig-ch2-check-t fig-ch2-check-d" font-family="Lora, Georgia, serif" fill="#2B2620">
<title id="fig-ch2-check-t">Is the split working? Three inputs, one snapshot</title>
<desc id="fig-ch2-check-d">Three readings go in: workload balance (worth up to 0.40), ownership clarity (up to 0.35) and leftover stress (up to 0.25). In the chapter’s made-up example, Sam and Alex earn 0.24 for balance (short by 0.16), 0.28 for ownership (short by 0.07) and 0.15 for stress (short by 0.10). Together that is 0.67, in the middle band, between 0.4 and 0.7: needs a look, where something is drifting. Start with the biggest shortfall: here, balance. The score judges the setup, never a person.</desc>

<rect x="1" y="1" width="538" height="760" rx="20" fill="#FCF9F1" stroke="#D9CBA3" stroke-width="2"/>
<text x="28" y="46" font-size="25" font-weight="bold" fill="#7A5620">Is the split working?</text>
<text x="28" y="76" font-size="19" font-style="italic" fill="#5A5346"><tspan x="28" dy="0">Three readings go in. One snapshot, from 0 to 1,</tspan><tspan x="28" dy="24.32">comes out.</tspan></text>
