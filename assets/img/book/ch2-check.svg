<text x="270" y="653.32" font-size="19" font-weight="bold" text-anchor="middle">Start with the biggest shortfall.</text>
<text x="270" y="678.02" font-size="19" font-style="italic" text-anchor="middle">It judges the setup, never a person.</text>
<text x="28" y="712.72" font-size="18" font-style="italic" fill="#5A5346"><tspan x="28" dy="0">The weights and bands are this book’s own choice,</tspan><tspan x="28" dy="23.04">not research findings. A snapshot, not a sentence.</tspan></text>
