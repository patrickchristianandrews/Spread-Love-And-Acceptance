<title id="fig-partone-tnn-t">Then, Now and Next: the three chapters of Part One</title>
<desc id="fig-partone-tnn-d">A timeline with three stops. Then: where your lens came from, the rules you learned at home. Now: your wiring and today’s weather, how you run and what you need. Next: who you are becoming, small steps toward what matters. An arrow carries forward only what you choose. The past is not yours to change; what you carry forward is.</desc>

