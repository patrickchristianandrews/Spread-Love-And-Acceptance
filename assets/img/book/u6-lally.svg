<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 647" width="540" height="647" role="img" aria-labelledby="fig-u6-lally-t fig-u6-lally-d" font-family="Lora, Georgia, serif" fill="#2B2620">
<title id="fig-u6-lally-t">How long a new habit takes to feel automatic</title>
<desc id="fig-u6-lally-d">A chart of how automatic a new daily habit feels, from 0 to the person’s own plateau, against days. Three illustrative curves rise and level off: a fast one that reaches 95 percent of its plateau at about 18 days, a middle one at about 66 days, the median in the study, and a slow one at about 254 days. A small dip on the middle curve shows a missed day; it did not meaningfully set progress back. Based on Lally and colleagues, 2010, who followed 96 volunteers.</desc>

