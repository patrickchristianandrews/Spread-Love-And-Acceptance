<text x="70" y="518" font-size="18">Slowest: about 254 days</text>
<text x="28" y="551" font-size="18" font-style="italic" fill="#5A5346"><tspan x="28" dy="0">Illustrative shapes, not the raw data. Lally and</tspan><tspan x="28" dy="23.04">colleagues (2010) followed 96 volunteers; reaching</tspan><tspan x="28" dy="23.04">95% of each person’s own plateau took 18 to 254</tspan><tspan x="28" dy="23.04">days, median 66. Simpler habits formed faster.</tspan></text>
