<text x="28" y="46" font-size="25" font-weight="bold" fill="#7A5620"><tspan x="28" dy="0">About two months, give or take a</tspan><tspan x="28" dy="32">lot</tspan></text>
<text x="28" y="108" font-size="19" font-style="italic" fill="#5A5346">How automatic a new daily habit feels, over time.</text>
