<text x="48" y="333" font-size="19" font-weight="bold" fill="#7A5620">Say it plainly and kindly</text>
<path d="M20 430.0 Q61.7 437.0 103.3 430.0 Q145.0 423.0 186.7 430.0 Q228.3 437.0 270.0 430.0 Q311.7 423.0 353.3 430.0 Q395.0 437.0 436.7 430.0 Q478.3 423.0 520.0 430.0" fill="none" stroke="#8E3B47" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
