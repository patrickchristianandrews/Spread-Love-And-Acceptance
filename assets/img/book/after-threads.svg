<text x="48" y="259" font-size="19" font-weight="bold" fill="#3E6B4C">Settle before you speak</text>
<path d="M20 356.0 Q61.7 363.0 103.3 356.0 Q145.0 349.0 186.7 356.0 Q228.3 363.0 270.0 356.0 Q311.7 349.0 353.3 356.0 Q395.0 363.0 436.7 356.0 Q478.3 349.0 520.0 356.0" fill="none" stroke="#7A5620" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
