<text x="48" y="555" font-size="19" font-weight="bold" fill="#3E6B4C">Your part, and only your part.</text>
<rect x="28" y="616" width="484" height="96.1" rx="12" fill="#ECE2C4"/>
<text x="270" y="649" font-size="19" font-style="italic" text-anchor="middle">Most of what goes wrong between people</text>
<text x="270" y="673.7" font-size="19" font-style="italic" text-anchor="middle">is understandable, and much of it</text>
<text x="270" y="698.4" font-size="19" font-style="italic" text-anchor="middle">can be put right.</text>
</svg>
