<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 735" width="540" height="735" role="img" aria-labelledby="fig-after-threads-t fig-after-threads-d" font-family="Lora, Georgia, serif" fill="#2B2620">
<title id="fig-after-threads-t">Six threads that run through the book</title>
<desc id="fig-after-threads-d">Three tall panels for Part One, Part Two and Part Three, with six colored threads running across all three: notice before you judge; settle before you speak; say it plainly and kindly; small steps beat big pushes; repair is normal; and your part, and only your part.</desc>

<rect x="1" y="1" width="538" height="733" rx="20" fill="#FCF9F1" stroke="#D9CBA3" stroke-width="2"/>
<text x="28" y="46" font-size="25" font-weight="bold" fill="#7A5620">Six threads through the book</text>
<text x="28" y="76" font-size="19" font-style="italic" fill="#5A5346">The same few ideas, in every part.</text>
<rect x="28" y="102" width="154.667" height="500" rx="14" fill="#DCEAF6"/>
<text x="105.333" y="132" font-size="19" font-weight="bold" fill="#5A5346" text-anchor="middle">Part One</text>
<rect x="192.667" y="102" width="154.667" height="500" rx="14" fill="#F1E2C2"/>
<text x="270" y="132" font-size="19" font-weight="bold" fill="#5A5346" text-anchor="middle">Part Two</text>
<rect x="357.333" y="102" width="154.667" height="500" rx="14" fill="#DCE7D8"/>
<text x="434.667" y="132" font-size="19" font-weight="bold" fill="#5A5346" text-anchor="middle">Part Three</text>
