<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 736" width="540" height="736" role="img" aria-labelledby="fig-front-ideas-t fig-front-ideas-d" font-family="Lora, Georgia, serif" fill="#2B2620">
<title id="fig-front-ideas-t">Five ideas the book rests on</title>
<desc id="fig-front-ideas-d">A simple building: a roof labelled &quot;A shared life that works for everyone in it&quot; rests on five numbered columns. One: see the whole load, the thinking and noticing as well as the doing. Two: fix the setup, not the person. Three: read your state first. Four: tune how you send and receive. Five: notice the quiet incentives, the way unclaimed jobs drift to one person. The base reads: each idea starts inside you, then shows up between you.</desc>

<rect x="1" y="1" width="538" height="734" rx="20" fill="#FCF9F1" stroke="#D9CBA3" stroke-width="2"/>
<text x="28" y="46" font-size="25" font-weight="bold" fill="#7A5620">Five ideas the book rests on</text>
<path d="M38 138.0 L270.0 72.0 L502 138.0 Z" fill="#F1E2C2" stroke="#7A5620" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="270" y="126" font-size="20" font-weight="bold" text-anchor="middle">A shared life that works</text>
<rect x="38" y="138" width="464" height="10" rx="3" fill="#A8792F"/>
<rect x="48" y="160" width="40" height="98.32" rx="4" fill="#ECE2C4" stroke="#7A5620" stroke-width="1.5"/>
<line x1="60" y1="166" x2="60" y2="252.32" stroke="#D9CBA3" stroke-width="2" stroke-linecap="round"/>
<line x1="76" y1="166" x2="76" y2="252.32" stroke="#D9CBA3" stroke-width="2" stroke-linecap="round"/>
<text x="68" y="216.16" font-size="18" font-weight="bold" fill="#7A5620" text-anchor="middle">I</text>
<text x="104" y="191" font-size="21" font-weight="bold">See the whole load</text>
<text x="104" y="216" font-size="19" fill="#5A5346"><tspan x="104" dy="0">Count the noticing, remembering and</tspan><tspan x="104" dy="24.32">planning, not just the doing.</tspan></text>
<rect x="48" y="258.32" width="40" height="98.32" rx="4" fill="#ECE2C4" stroke="#7A5620" stroke-width="1.5"/>
<line x1="60" y1="264.32" x2="60" y2="350.64" stroke="#D9CBA3" stroke-width="2" stroke-linecap="round"/>
<line x1="76" y1="264.32" x2="76" y2="350.64" stroke="#D9CBA3" stroke-width="2" stroke-linecap="round"/>
<text x="68" y="314.48" font-size="18" font-weight="bold" fill="#7A5620" text-anchor="middle">II</text>
<text x="104" y="289.32" font-size="21" font-weight="bold">Fix the setup, not the person</text>
<text x="104" y="314.32" font-size="19" fill="#5A5346"><tspan x="104" dy="0">When a job keeps slipping, change the</tspan><tspan x="104" dy="24.32">arrangement.</tspan></text>
<rect x="48" y="356.64" width="40" height="98.32" rx="4" fill="#ECE2C4" stroke="#7A5620" stroke-width="1.5"/>
<line x1="60" y1="362.64" x2="60" y2="448.96" stroke="#D9CBA3" stroke-width="2" stroke-linecap="round"/>
<line x1="76" y1="362.64" x2="76" y2="448.96" stroke="#D9CBA3" stroke-width="2" stroke-linecap="round"/>
<text x="68" y="412.8" font-size="18" font-weight="bold" fill="#7A5620" text-anchor="middle">III</text>
<text x="104" y="387.64" font-size="21" font-weight="bold">Read your state first</text>
<text x="104" y="412.64" font-size="19" fill="#5A5346"><tspan x="104" dy="0">Check how full your tank is before a</tspan><tspan x="104" dy="24.32">hard talk.</tspan></text>
<rect x="48" y="454.96" width="40" height="98.32" rx="4" fill="#ECE2C4" stroke="#7A5620" stroke-width="1.5"/>
<line x1="60" y1="460.96" x2="60" y2="547.28" stroke="#D9CBA3" stroke-width="2" stroke-linecap="round"/>
<line x1="76" y1="460.96" x2="76" y2="547.28" stroke="#D9CBA3" stroke-width="2" stroke-linecap="round"/>
<text x="68" y="511.12" font-size="18" font-weight="bold" fill="#7A5620" text-anchor="middle">IV</text>
<text x="104" y="485.96" font-size="21" font-weight="bold">Tune how you send and receive</text>
<text x="104" y="510.96" font-size="19" fill="#5A5346"><tspan x="104" dy="0">A clash is often crossed signals, not bad</tspan><tspan x="104" dy="24.32">intent.</tspan></text>
<rect x="48" y="553.28" width="40" height="98.32" rx="4" fill="#ECE2C4" stroke="#7A5620" stroke-width="1.5"/>
<line x1="60" y1="559.28" x2="60" y2="645.6" stroke="#D9CBA3" stroke-width="2" stroke-linecap="round"/>
<line x1="76" y1="559.28" x2="76" y2="645.6" stroke="#D9CBA3" stroke-width="2" stroke-linecap="round"/>
<text x="68" y="609.44" font-size="18" font-weight="bold" fill="#7A5620" text-anchor="middle">V</text>
<text x="104" y="584.28" font-size="21" font-weight="bold">Notice the quiet incentives</text>
<text x="104" y="609.28" font-size="19" fill="#5A5346"><tspan x="104" dy="0">Unclaimed jobs drift to whoever notices</tspan><tspan x="104" dy="24.32">first.</tspan></text>
<rect x="32" y="651.6" width="476" height="12" rx="3" fill="#A8792F"/>
<rect x="32" y="667.6" width="476" height="46" rx="8" fill="#ECE2C4"/>
<text x="270" y="697.6" font-size="19" font-style="italic" text-anchor="middle">Each starts inside you, then shows up between you.</text>
</svg>
