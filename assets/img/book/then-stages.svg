<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 626" width="540" height="626" role="img" aria-labelledby="fig-then-stages-t fig-then-stages-d" font-family="Lora, Georgia, serif" fill="#2B2620">
<title id="fig-then-stages-t">Each stage of growing up asks its own question</title>
<desc id="fig-then-stages-d">A winding path with six stops. About 0 to 1: is the world safe, will someone come? About 2 to 3: can I do it myself? About 4 to 5: is it okay to start things and take up space? About 6 to 11: am I capable? About 12 to 17: who am I, and where do I belong? About 18 to 39: can I be close without losing myself? The questions come back at big changes, and can be answered again.</desc>

<rect x="1" y="1" width="538" height="624" rx="20" fill="#FCF9F1" stroke="#D9CBA3" stroke-width="2"/>
<text x="28" y="46" font-size="25" font-weight="bold" fill="#7A5620">Each stage asks its own question</text>
<text x="28" y="76" font-size="19" font-style="italic" fill="#5A5346">Ages are rough. People move at their own pace.</text>
<path d="M54 130.0 C54 159.0 78 159.0 78 188.0 C78 217.0 54 217.0 54 246.0 C54 287.8 78 287.8 78 329.6 C78 358.6 54 358.6 54 387.6 C54 416.6 78 416.6 78 445.6" fill="none" stroke="#D9CBA3" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="54" cy="130" r="13" fill="#FCF9F1" stroke="#2F5F8A" stroke-width="3"/>
<text x="106" y="128" font-size="18" font-style="italic" fill="#2F5F8A">about 0–1</text>
<text x="106" y="152" font-size="20">Is the world safe? Will someone come?</text>
<circle cx="78" cy="188" r="13" fill="#FCF9F1" stroke="#2F5F8A" stroke-width="3"/>
<text x="106" y="186" font-size="18" font-style="italic" fill="#2F5F8A">about 2–3</text>
<text x="106" y="210" font-size="20">Can I do it myself?</text>
<circle cx="54" cy="246" r="13" fill="#FCF9F1" stroke="#3E6B4C" stroke-width="3"/>
<text x="106" y="244" font-size="18" font-style="italic" fill="#3E6B4C">about 4–5</text>
<text x="106" y="268" font-size="20"><tspan x="106" dy="0">Is it okay to start things and take up</tspan><tspan x="106" dy="25.6">space?</tspan></text>
<circle cx="78" cy="329.6" r="13" fill="#FCF9F1" stroke="#3E6B4C" stroke-width="3"/>
<text x="106" y="327.6" font-size="18" font-style="italic" fill="#3E6B4C">about 6–11</text>
<text x="106" y="351.6" font-size="20">Am I capable?</text>
<circle cx="54" cy="387.6" r="13" fill="#FCF9F1" stroke="#7A5620" stroke-width="3"/>
<text x="106" y="385.6" font-size="18" font-style="italic" fill="#7A5620">about 12–17</text>
<text x="106" y="409.6" font-size="20">Who am I, and where do I belong?</text>
<circle cx="78" cy="445.6" r="13" fill="#FCF9F1" stroke="#7A5620" stroke-width="3"/>
<text x="106" y="443.6" font-size="18" font-style="italic" fill="#7A5620">about 18–39</text>
<text x="106" y="467.6" font-size="20">Can I be close without losing myself?</text>
<rect x="28" y="489.6" width="484" height="64" rx="12" fill="#ECE2C4"/>
<text x="270" y="516.6" font-size="19" font-style="italic" text-anchor="middle">The questions come back at big changes,</text>
<text x="270" y="540.6" font-size="19" font-style="italic" text-anchor="middle">and each time you can answer a little differently.</text>
<text x="28" y="576.6" font-size="18" font-style="italic" fill="#5A5346"><tspan x="28" dy="0">After Erik Erikson’s stages (1950s): a theory for</tspan><tspan x="28" dy="23.04">reflection, not a measured sequence.</tspan></text>
</svg>
