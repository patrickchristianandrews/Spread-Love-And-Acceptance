<text x="28" y="663.32" font-size="18" font-style="italic" fill="#5A5346"><tspan x="28" dy="0">After Brennan, Clark and Shaver (1998) and Fraley</tspan><tspan x="28" dy="23.04">and colleagues (2015): adult attachment is best</tspan><tspan x="28" dy="23.04">measured as two scales, not types. Dots are</tspan><tspan x="28" dy="23.04">illustrative, not data.</tspan></text>
