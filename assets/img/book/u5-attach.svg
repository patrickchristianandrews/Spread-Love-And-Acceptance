<text x="28" y="46" font-size="25" font-weight="bold" fill="#7A5620">Patterns, not boxes</text>
<text x="28" y="76" font-size="19" font-style="italic" fill="#5A5346"><tspan x="28" dy="0">Two scales. Everyone sits somewhere, and can</tspan><tspan x="28" dy="24.32">move.</tspan></text>
