<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 759" width="540" height="759" role="img" aria-labelledby="fig-u5-attach-t fig-u5-attach-d" font-family="Lora, Georgia, serif" fill="#2B2620">
<title id="fig-u5-attach-t">Attachment as two dimensions, not boxes</title>
<desc id="fig-u5-attach-d">A square field. Across: avoidance, discomfort with closeness and depending on others, from low to high. Up: anxiety, worry about being rejected or left, from low to high. Many dots show that people sit anywhere in the field, not in four boxes. Soft notes in the corners describe tendencies: reaching for reassurance, close and at ease, handling things alone, wanting closeness while fearing it. An arrow shows that a person’s place can shift, for example with a steady, supportive relationship.</desc>
