<circle cx="48" cy="706" r="8" fill="#FCF9F1" stroke="#2B2620" stroke-width="3"/>
<text x="64" y="712" font-size="18">one made-up person</text>
<rect x="28" y="730" width="484" height="71.4" rx="12" fill="#ECE2C4"/>
<text x="270" y="763" font-size="19" font-style="italic" text-anchor="middle">Every trait has gifts and costs at both ends.</text>
<text x="270" y="787.7" font-size="19" font-style="italic" text-anchor="middle">Clashes are mostly about fit, not fault.</text>
<text x="28" y="822.4" font-size="18" font-style="italic" fill="#5A5346"><tspan x="28" dy="0">The Big Five or five-factor model (for example</tspan><tspan x="28" dy="23.04">McCrae and Costa, 1987): a description of how</tspan><tspan x="28" dy="23.04">people differ, not an explanation. Illustrative shapes.</tspan></text>
</svg>
