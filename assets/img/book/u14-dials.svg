<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 895" width="540" height="895" role="img" aria-labelledby="fig-u14-sliders-t fig-u14-sliders-d" font-family="Lora, Georgia, serif" fill="#2B2620">
<title id="fig-u14-sliders-t">Five traits, each a slider, not a box</title>
<desc id="fig-u14-sliders-d">Five rows, one for each of the Big Five traits: openness, conscientiousness, extraversion, agreeableness, and emotional stability (the other end is called neuroticism). Each row is a line between two plain-language ends, with a hump showing that most people sit near the middle. A dot marks one made-up person on each slider. Every trait has gifts and costs at both ends, and people change across life.</desc>

<rect x="1" y="1" width="538" height="893" rx="20" fill="#FCF9F1" stroke="#D9CBA3" stroke-width="2"/>
<text x="28" y="46" font-size="25" font-weight="bold" fill="#7A5620">Traits are sliders, not boxes</text>
<text x="28" y="76" font-size="19" font-style="italic" fill="#5A5346">Most people sit near the middle of each one.</text>
<text x="28" y="124" font-size="20" font-weight="bold" fill="#2F5F8A">Openness</text>
