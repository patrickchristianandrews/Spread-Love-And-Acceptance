<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 603" width="540" height="603" role="img" aria-labelledby="fig-ch1-whistle-t fig-ch1-whistle-d" font-family="Lora, Georgia, serif" fill="#2B2620">
<title id="fig-ch1-whistle-t">The radio whistle: two signals nearly in step</title>
<desc id="fig-ch1-whistle-d">Three wave lines. Your signal, in blue, and their signal, in rose, are nearly the same speed but not quite. Added together they make a third pattern that swells and fades, a whistle that neither one sent. The point: a clash can start between two people, without either one starting it, and it is loudest when two people are close but slightly out of step.</desc>

<rect x="1" y="1" width="538" height="601" rx="20" fill="#FCF9F1" stroke="#D9CBA3" stroke-width="2"/>
<text x="28" y="46" font-size="25" font-weight="bold" fill="#7A5620">The radio whistle</text>
<text x="28" y="76" font-size="19" font-style="italic" fill="#5A5346">Two reasonable signals, nearly in step.</text>
