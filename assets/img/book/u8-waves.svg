<text x="418.16" y="146.32" font-size="17" font-weight="bold" fill="#8E3B47" text-anchor="middle">a song, a date</text>
<line x1="418.16" y1="152.32" x2="418.16" y2="170.32" stroke="#8E3B47" stroke-width="1.5" stroke-linecap="round"/>
<path d="M218 458.32 H496" fill="none" stroke="#5A5346" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fig-u8-waves-ar-5a5346)"/>
<text x="496" y="482.32" font-size="17" font-style="italic" fill="#5A5346" text-anchor="end">weeks, months, years</text>
<rect x="28" y="496.32" width="484" height="71.4" rx="12" fill="#ECE2C4"/>
<text x="270" y="529.32" font-size="19" font-style="italic" text-anchor="middle">Waves, not neat stages. A good week, then a</text>
<text x="270" y="554.02" font-size="19" font-style="italic" text-anchor="middle">bad day, is normal, not going backward.</text>
<text x="28" y="588.72" font-size="18" font-style="italic" fill="#5A5346"><tspan x="28" dy="0">After Stroebe and Schut’s dual process model</tspan><tspan x="28" dy="23.04">(1999), a widely used framework rather than a</tspan><tspan x="28" dy="23.04">precise prediction. Illustrative line.</tspan></text>
</svg>
