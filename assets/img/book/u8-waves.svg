<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 661" width="540" height="661" role="img" aria-labelledby="fig-u8-waves-t fig-u8-waves-d" font-family="Lora, Georgia, serif" fill="#2B2620">
<title id="fig-u8-waves-t">Grief in waves: moving between loss and life</title>
<desc id="fig-u8-waves-d">Two lanes over time. The upper lane is loss: missing them, crying, remembering. The lower lane is restoration: practical changes, new roles, and breaks from grief. A line swings back and forth between the two lanes, sometimes pulled sharply up by a song, a date or a place. The swinging is healthy. Grief comes in waves, not a straight line of neat stages.</desc>
<defs><marker id="fig-u8-waves-ar-5a5346" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#5A5346"/></marker></defs>
<rect x="1" y="1" width="538" height="659" rx="20" fill="#FCF9F1" stroke="#D9CBA3" stroke-width="2"/>
<text x="28" y="46" font-size="25" font-weight="bold" fill="#7A5620">Grief comes in waves</text>
<text x="28" y="76" font-size="19" font-style="italic" fill="#5A5346"><tspan x="28" dy="0">Moving back and forth between loss and life is</tspan><tspan x="28" dy="24.32">part of it.</tspan></text>
<rect x="28" y="156.32" width="484" height="118" rx="12" fill="#DCEAF6"/>
<rect x="28" y="320.32" width="484" height="118" rx="12" fill="#DCE7D8"/>
<text x="42" y="184.32" font-size="21" font-weight="bold" fill="#2F5F8A">Loss</text>
<text x="42" y="208.32" font-size="18" font-style="italic" fill="#5A5346">missing them, crying,</text>
<text x="42" y="230.32" font-size="18" font-style="italic" fill="#5A5346">remembering</text>
<text x="42" y="380.32" font-size="21" font-weight="bold" fill="#3E6B4C">Restoration</text>
<text x="42" y="404.32" font-size="18" font-style="italic" fill="#5A5346">practical changes, new roles,</text>
<text x="42" y="426.32" font-size="18" font-style="italic" fill="#5A5346">a break from grief</text>
<text x="42" y="304.32" font-size="18" font-style="italic" fill="#5A5346">everyday life</text>
