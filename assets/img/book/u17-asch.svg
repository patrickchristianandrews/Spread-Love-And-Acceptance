<rect x="28" y="610" width="484" height="71.4" rx="12" fill="#ECE2C4"/>
<text x="270" y="643" font-size="19" font-style="italic" text-anchor="middle">One calm, kind voice saying “I see it</text>
<text x="270" y="667.7" font-size="19" font-style="italic" text-anchor="middle">differently” often frees others to say so too.</text>
<text x="28" y="702.4" font-size="18" font-style="italic" fill="#5A5346"><tspan x="28" dy="0">Asch (1956). About a quarter of people never went</tspan><tspan x="28" dy="23.04">along. Across 133 later studies the effect held but</tspan><tspan x="28" dy="23.04">varied by time and culture (Bond and Smith, 1996).</tspan></text>
