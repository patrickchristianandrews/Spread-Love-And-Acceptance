<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 775" width="540" height="775" role="img" aria-labelledby="fig-u17-asch-t fig-u17-asch-d" font-family="Lora, Georgia, serif" fill="#2B2620">
<title id="fig-u17-asch-t">Going along with the group, and the power of one other voice</title>
<desc id="fig-u17-asch-d">A line-matching card: a target line, and three lines labeled A, B and C, where C clearly matches. In the first row, everyone else in the group says A, and the person at the end often goes along. In Asch’s studies, people went along with an obviously wrong answer on about a third of answers, and about a quarter never went along. In the second row, one other person says C, and going along fell sharply. One calm voice frees others to say what they see.</desc>

<rect x="1" y="1" width="538" height="773" rx="20" fill="#FCF9F1" stroke="#D9CBA3" stroke-width="2"/>
<text x="28" y="46" font-size="25" font-weight="bold" fill="#7A5620">We go along more than we think</text>
<text x="28" y="76" font-size="19" font-style="italic" fill="#5A5346">And one other voice changes a lot.</text>
<rect x="48" y="98" width="444" height="150" rx="12" fill="#FFFFFF" stroke="#D9CBA3" stroke-width="2"/>
<text x="78" y="128" font-size="18" font-style="italic" fill="#5A5346">Which line matches?</text>
