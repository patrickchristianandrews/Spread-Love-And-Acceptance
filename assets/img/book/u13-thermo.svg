<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 865" width="540" height="865" role="img" aria-labelledby="fig-u13-thermo-t fig-u13-thermo-d" font-family="Lora, Georgia, serif" fill="#2B2620">
<title id="fig-u13-thermo-t">The anger thermometer and the hot minutes</title>
<desc id="fig-u13-thermo-d">A thermometer with four levels and what helps at each. Irritated: say it early and plainly. Annoyed: notice the body, a hot face, a tight jaw, clenched hands. Angry, the hot minutes: slow the body first with long out-breaths, and step away with a time to come back. Letting rip feeds it. Once cooler: say it, don’t throw it, and repair any sharp moments.</desc>

<rect x="1" y="1" width="538" height="863" rx="20" fill="#FCF9F1" stroke="#D9CBA3" stroke-width="2"/>
<text x="28" y="46" font-size="25" font-weight="bold" fill="#7A5620">Anger rises fast</text>
<text x="28" y="76" font-size="19" font-style="italic" fill="#5A5346">What helps depends on how hot it is.</text>
<rect x="54" y="108" width="40" height="420" rx="20" fill="#FFFFFF" stroke="#2B2620" stroke-width="2.5"/>
<circle cx="74" cy="550" r="34" fill="#8E3B47" stroke="#2B2620" stroke-width="2.5"/>
<rect x="62" y="116" width="24" height="97" rx="8" fill="#8E3B47"/>
<line x1="94" y1="108" x2="108" y2="108" stroke="#2B2620" stroke-width="2" stroke-linecap="round"/>
<text x="120" y="138" font-size="20" font-weight="bold" fill="#8E3B47">Hot minutes</text>
<text x="120" y="164" font-size="18" fill="#5A5346"><tspan x="120" dy="0">Slow the body first: long out-breaths. Step</tspan><tspan x="120" dy="23.04">away, with a time to come back.</tspan></text>
<rect x="62" y="213" width="24" height="105" rx="0" fill="#C9707C"/>
<line x1="94" y1="213" x2="108" y2="213" stroke="#2B2620" stroke-width="2" stroke-linecap="round"/>
<text x="120" y="243" font-size="20" font-weight="bold">Angry</text>
<text x="120" y="269" font-size="18" fill="#5A5346"><tspan x="120" dy="0">Don’t solve it now. Problems can wait;</tspan><tspan x="120" dy="23.04">sharp words are hard to take back.</tspan></text>
<rect x="62" y="318" width="24" height="105" rx="0" fill="#E3A16B"/>
<line x1="94" y1="318" x2="108" y2="318" stroke="#2B2620" stroke-width="2" stroke-linecap="round"/>
<text x="120" y="348" font-size="20" font-weight="bold">Annoyed</text>
<text x="120" y="374" font-size="18" fill="#5A5346"><tspan x="120" dy="0">Notice the body: hot face, tight jaw,</tspan><tspan x="120" dy="23.04">clenched hands.</tspan></text>
<rect x="62" y="423" width="24" height="105" rx="0" fill="#E9C77A"/>
<line x1="94" y1="423" x2="108" y2="423" stroke="#2B2620" stroke-width="2" stroke-linecap="round"/>
<text x="120" y="453" font-size="20" font-weight="bold">Irritated</text>
<text x="120" y="479" font-size="18" fill="#5A5346">Say it early, plainly and kindly.</text>
<rect x="62" y="522" width="24" height="20" rx="0" fill="#E9C77A"/>
<rect x="28" y="598" width="484" height="52" rx="12" fill="#FFFFFF" stroke="#8E3B47" stroke-width="1.5" stroke-dasharray="6 5"/>
<path d="M46 616.0 L62 632.0 M62 616.0 L46 632.0" fill="none" stroke="#8E3B47" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76" y="630" font-size="19" font-weight="bold" fill="#8E3B47">Letting rip doesn’t empty it. It feeds it.</text>
<rect x="28" y="662" width="484" height="82" rx="12" fill="#DCE7D8" stroke="#3E6B4C" stroke-width="1.5"/>
<text x="46" y="694" font-size="19" font-weight="bold" fill="#3E6B4C">Once cooler: say it, don’t throw it.</text>
<text x="46" y="722" font-size="19">Then repair any sharp moments.</text>
<text x="28" y="769" font-size="18" font-style="italic" fill="#5A5346"><tspan x="28" dy="0">In a review of 154 studies (Kjærvik and Bushman,</tspan><tspan x="28" dy="23.04">2024), activities that calm the body reduced anger;</tspan><tspan x="28" dy="23.04">revving it up did not help.</tspan></text>
</svg>
